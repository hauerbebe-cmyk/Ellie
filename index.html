<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ellie">
<meta name="theme-color" content="#fbf6ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Ellie</title>
<script src="config.js"></script>
<style>
:root{
  --bg:#fbf6ee; --card:#ffffff; --ink:#2b2520; --muted:#8a7f74; --line:#ece3d6;
  --accent:#d9733b; --accent-soft:#fbe6d6; --ok:#3f9a5d; --ok-soft:#dff1e4;
  --warn:#c98a12; --warn-soft:#fbefd2; --danger:#c24a3a;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --r:18px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1c1915; --card:#29241f; --ink:#f3ece3; --muted:#a39888; --line:#3a332c;
  --accent:#f0915a; --accent-soft:#4a3020; --ok:#6cc58a; --ok-soft:#1f3a28;
  --warn:#e8b34a; --warn-soft:#45381a; --danger:#ef7a68;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;font-size:16px;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px);max-width:560px;margin:0 auto}
h1{font-size:28px;margin:4px 0 14px;letter-spacing:-.02em}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:transparent;color:var(--muted);padding:8px}
.btn.ok{background:var(--ok);}
.btn.block{width:100%;padding:14px;font-size:17px}
.btn.danger{background:transparent;color:var(--danger)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:13px;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.topbar{display:flex;align-items:center;justify-content:space-between}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:19px}
input[type=text],input[type=email],input[type=password],input[type=time],textarea{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none;font-size:16px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 2px 6px}

/* Tabbar */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:space-around;z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
nav button .i{font-size:23px;line-height:1.1;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--accent);font-weight:600}
nav button.on .i{filter:none;opacity:1}

/* Start */
.hero{text-align:center;padding:30px 10px 26px}
.hero .hi{color:var(--muted);font-size:15px}
.hero .nick{font-size:clamp(34px,11vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:10px 0 8px;
  color:var(--accent);word-break:break-word;transition:opacity .2s,transform .2s}
.hero .photo,.hero .nick{transition:opacity .18s,transform .18s}
.hero.swap .photo,.hero.swap .nick{opacity:0;transform:scale(.96)}
.hero.withphoto{padding-top:6px}
.hero .photo{width:100%;aspect-ratio:4/5;max-height:42vh;border-radius:24px;overflow:hidden;margin:0 auto 16px;background:var(--line);box-shadow:var(--shadow)}
.hero .photo img{width:100%;height:100%;object-fit:cover;display:block}
.addphoto{width:100%;text-align:center;color:var(--accent);font-weight:600;border-style:dashed;margin-bottom:14px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.pgrid .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px}
.hero .tip{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;text-align:left}
.tile .big{font-size:28px;font-weight:800;margin:4px 0 0}
.tile .lbl{font-size:13px;color:var(--muted)}
.tile.wide{grid-column:1/-1}

/* Date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.datenav button{width:40px;height:36px;border-radius:10px;font-size:20px;color:var(--accent)}
.datenav button:disabled{opacity:.25}
.datenav .d{font-weight:600}

/* Meds */
.med.done{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.med .name{font-weight:700;font-size:17px}
.med .slot{font-size:13px;color:var(--muted)}
.sollist{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 10px;font-size:15px}
.sollist dt{color:var(--muted)} .sollist dd{margin:0;font-weight:600}
.stamp{font-size:13px;font-weight:600;color:var(--ok);margin-top:2px}
.actions{display:flex;gap:8px}
.taper{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0 4px}
.prog{height:6px;border-radius:9px;background:var(--line);margin:8px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:9px}
.pieces{font-weight:600;font-size:15px;margin-bottom:4px}
.steps{margin-top:10px}
.steps .st{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.steps .st.past{opacity:.4}
.steps .st.now{color:var(--accent)}
.steps .st.now b{font-weight:800}
.actions .btn{flex:1}

/* Bark */
.barkhero{text-align:center;padding:10px 0 4px}
.barkcount{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.03em}
.barkbtn{width:170px;height:170px;border-radius:50%;background:var(--accent);color:#fff;font-size:34px;font-weight:800;
  box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 45%,transparent);margin:18px auto 8px;display:grid;place-items:center;
  transition:transform .12s}
.barkbtn:active{transform:scale(.94)}
.barkbtn span{display:block;font-size:14px;font-weight:600;opacity:.9}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.bars .b i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--accent);min-height:3px;opacity:.85}
.bars .b.today i{opacity:1}
.bars .b em{font-style:normal;font-weight:700;color:var(--ink);font-size:12px}
.reason{width:100%;text-align:left;padding:16px;border-radius:14px;background:var(--bg);border:1px solid var(--line);margin-bottom:8px;font-size:17px;font-weight:600;display:flex;gap:12px;align-items:center}
.reason:active{background:var(--accent-soft)}
.reason.newreason{background:transparent;border-style:dashed;color:var(--accent)}
.chip.iconchip{font-size:22px;padding:6px 10px}
.list .li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}

/* Protokoll */
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;padding:10px 0 8px;border-radius:14px;background:var(--bg);border:2px solid transparent;font-size:28px;display:flex;flex-direction:column;align-items:center;gap:2px}
.moods button small{font-size:10px;color:var(--muted)}
.moods button.on{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Notes */
.note .t{font-weight:700;font-size:17px}
.note .b{white-space:pre-wrap;margin-top:4px;line-height:1.4}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(20,12,4,.38);z-index:20;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .25s ease;max-width:560px;margin:0 auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 6px;font-size:21px;padding-right:40px}
.sheetx{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--line);color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.demo{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:8px 12px;border-radius:12px;margin-bottom:10px;text-align:center}
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login .paw{font-size:64px}
.login form{text-align:left;margin-top:20px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden></nav>
<div class="toast" id="toast"></div>

<script>
/* ====== Grundgerüst ====== */
const CFG = window.ELLIE_CONFIG || {};
const DEMO = !CFG.supabaseUrl || !CFG.supabaseKey || CFG.supabaseUrl.includes('DEIN-PROJEKT');
const DOG = CFG.dogName || 'Ellie';
const DEFAULT_REASONS = [
  {key:'hausflur', label:'Geräusch im Hausflur', icon:'🚪'},
  {key:'draussen', label:'Geräusch draußen', icon:'🌳'},
  {key:'anderes',  label:'Anderer Grund', icon:'❓'},
];
const REASON_ICONS = ['🔔','🚪','🌳','🐕','🐈','🚗','📦','👤','🧑‍🔧','🔊','📺','🌙','🍖','🎆','❓'];
// Bell-Gründe kommen aus der Datenbank (gemeinsam), sonst die Standard-Gründe
function allReasons(){
  const r=S.bark_reasons.length?[...S.bark_reasons]:DEFAULT_REASONS.map(x=>({...x,active:true}));
  return r.sort((a,b)=>(a.key==='anderes')-(b.key==='anderes')||String(a.created_at||'').localeCompare(String(b.created_at||'')));
}
function activeReasons(){return allReasons().filter(r=>r.active!==false)}
function reasonOf(k){return allReasons().find(r=>r.key===k)||{key:k,label:k||'?',icon:'❓'}}
const MOODS = [
  {v:1,e:'😣',l:'Schlecht'},{v:2,e:'😕',l:'Naja'},{v:3,e:'😐',l:'Okay'},{v:4,e:'🙂',l:'Gut'},{v:5,e:'🤩',l:'Super'}
];
const TAGS = CFG.dayTags || ['Verspielt','Verschmust','Ruhig','Müde','Aufgedreht','Ängstlich','Gut gefressen','Wenig gefressen','Magen-Darm','Viel gebellt'];
const NICKS = ['Makrelenöhrchen','Gagafrosch','Schnecke','Schneckenbär','Schneckentiger','Schneckerich','Schnecki Zimtzucker','Schnecki Süßsauer','Fürst von Schneckerich','Kröti','Kröterich','Krötofferus','Elsbeth(i)','Elsbethbär','Eleonore','Elisabeth','Ellie Elsbethson','Mausebär','Ed von Schneck','Krötentiger','Troll','Schneckennudel','Babyratte','Trollnase','Krümelbärchen','Maus','Mauserich','Stinketroll','Torfnase','Supermaus','Zaubermaus','Made','Made im Speckmantel','Quatschbär','Wutz','Zuckermaus','Seehund','Seeigel','Wurst','Wiener Würstchen','Pockenschweinchen','winkelfreund','Winkelenthusiatin','Fauchi 3','Schnuffnase','Quatschkröte','Schneckerinchen','Perfekter kleiner Winkel','Springpferd','El Kröterich','Trüffelnase','Mausezahn','Eierkopf','Zwiebelhexe','Eiertanzbär','Knödelmaus','Kanalratte','Hohle Fritte','Schneckeroncinii'];
// Ausschleichplan Alprazolam (Dr. Feist, 28.09.2026)
// Fluoxetin: 30 mg bis Startdatum (noch offen), dann 14 Tage 35 mg, danach dauerhaft 40 mg
const FLUOX_PLAN = {title:'Aufdosieren',start:null,pre:{mg:30,pieces:''},steps:[{days:14,mg:35,pieces:''},{days:null,mg:40,pieces:''}]};
const ALPRA_TAPER = {
  title:'Ausschleichen',
  start:'2026-10-03', pre:{mg:0.5,pieces:'1 Tbl. 0,5 mg'},
  steps:[
    {days:10,mg:0.4375,pieces:'¾ Tbl. 0,5 mg + ¼ Tbl. 0,25 mg'},
    {days:10,mg:0.375, pieces:'¾ Tbl. 0,5 mg'},
    {days:10,mg:0.3125,pieces:'½ Tbl. 0,5 mg + ¼ Tbl. 0,25 mg'},
    {days:14,mg:0.25,  pieces:'½ Tbl. 0,5 mg'},
    {days:14,mg:0.1875,pieces:'¼ Tbl. 0,5 mg + ¼ Tbl. 0,25 mg'},
    {days:14,mg:0.125, pieces:'¼ Tbl. 0,5 mg'},
    {days:14,mg:0.0625,pieces:'¼ Tbl. 0,25 mg'},
  ]};
const TABLES = ['nicknames','meds','med_logs','barks','daily_log','notes','bark_reasons'];
const OPTIONAL = ['bark_reasons']; // fehlt evtl. noch, wenn das SQL-Update nicht gelaufen ist
const TABS = [
  {id:'start', i:'🏠', l:'Start'},
  {id:'meds',  i:'💊', l:'Medis'},
  {id:'bark',  i:'🗣️', l:'Bellistima'},
  {id:'log',   i:'📖', l:'Protokoll'},
  {id:'notes', i:'📝', l:'Notizen'},
];

let sb = null, me = {name:''};
const S = Object.fromEntries(TABLES.map(t=>[t,[]])); S.photos=[];
const ui = { tab:(new URLSearchParams(location.search).get('tab')==='meds'?'meds':'start'), medDay:today(), logDay:today(), nick:null, logDirty:false, editPlan:false };
const VAPID_PUBLIC = 'BA4VLCa6sqQPoSk9rq8p63oHyH5gLsDJH8YktJs4FlRhqNFpAfMv0PLKS4wT7asnDG45vSjXRje4w3qD_fSZ5SY';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x'+Date.now()+Math.random().toString(16).slice(2));
function pad(n){return String(n).padStart(2,'0')}
function today(){return dayOf(new Date())}
function dayOf(d){d=new Date(d);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addDays(day,n){const d=new Date(day+'T12:00:00');d.setDate(d.getDate()+n);return dayOf(d)}
function hm(ts){const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function dayLabel(day){
  const t=today(); if(day===t) return 'Heute'; if(day===addDays(t,-1)) return 'Gestern'; if(day===addDays(t,1)) return 'Morgen';
  return new Date(day+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function fmtD(day){return new Date(day+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}
function fmtMg(x){return Number(x).toLocaleString('de-DE',{maximumFractionDigits:4})+' mg'}
function wd(day){return new Date(day+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short'}).replace('.','')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ====== Daten ====== */
async function loadTable(t){
  if(DEMO) return;
  let q = sb.from(t).select('*');
  if(t==='barks'||t==='med_logs'){const d=new Date();d.setDate(d.getDate()-60);q=q.gte('created_at',d.toISOString())}
  const {data,error} = await q.order('created_at',{ascending:true});
  if(error){console.error(error);if(!OPTIONAL.includes(t))toast('Laden fehlgeschlagen');return}
  S[t]=data||[];
}
async function loadAll(){ await Promise.all([...TABLES.map(loadTable),loadPhotos()]); }
function putLocal(t,row){const i=S[t].findIndex(r=>r.id===row.id); if(i>=0) S[t][i]=row; else S[t].push(row)}
async function ins(t,row){
  row = {author:me.name, ...row};
  if(DEMO){row.id=uid();row.created_at=row.created_at||new Date().toISOString();S[t].push(row);render();return row}
  const {data,error} = await sb.from(t).insert(row).select().single();
  if(error){console.error(error);toast('Speichern fehlgeschlagen');return null}
  putLocal(t,data);render();return data;
}
async function insMany(t,rows){
  rows=rows.map(r=>({author:me.name,...r}));
  if(DEMO){rows.forEach(r=>{r.id=uid();r.created_at=new Date().toISOString();S[t].push(r)});render();return}
  const {data,error}=await sb.from(t).insert(rows).select();
  if(error){console.error(error);toast('Speichern fehlgeschlagen');return}
  data.forEach(r=>putLocal(t,r));render();
}
async function upd(t,id,patch){
  if(DEMO){Object.assign(S[t].find(r=>r.id===id),patch);render();return}
  const {data,error} = await sb.from(t).update(patch).eq('id',id).select().single();
  if(error){console.error(error);toast('Speichern fehlgeschlagen');return}
  putLocal(t,data);render();
}
async function del(t,id){
  S[t]=S[t].filter(r=>r.id!==id);
  if(t==='meds') S.med_logs=S.med_logs.filter(l=>l.med_id!==id);
  render();
  if(DEMO) return;
  const {error} = await sb.from(t).delete().eq('id',id);
  if(error){console.error(error);toast('Löschen fehlgeschlagen');loadTable(t).then(render)}
}
function subscribe(){
  if(DEMO) return;
  const ch = sb.channel('ellie');
  TABLES.forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},p=>{
    if(p.eventType==='DELETE') S[t]=S[t].filter(r=>r.id!==p.old.id); else putLocal(t,p.new);
    render(true);
  }));
  ch.subscribe();
}

/* ====== Sheet ====== */
function openSheet(html, mount){
  closeSheet(true);
  const bd=document.createElement('div');bd.className='backdrop';
  const sh=document.createElement('div');sh.className='sheet';sh.innerHTML='<div class="grab"></div><button class="sheetx" aria-label="Schließen">✕</button>'+html;
  sh.querySelector('.sheetx').onclick=()=>closeSheet();
  bd.onclick=()=>closeSheet();
  document.body.append(bd,sh);
  requestAnimationFrame(()=>{bd.classList.add('show');sh.classList.add('show')});
  mount && mount(sh);
  return sh;
}
function closeSheet(now){
  document.querySelectorAll('.sheet,.backdrop').forEach(el=>{
    if(now){el.remove();return}
    el.classList.remove('show');setTimeout(()=>el.remove(),260);
  });
}

/* ====== Navigation & Rendern ====== */
function go(tab){ui.tab=tab;if(tab==='start'){ui.nick=null;ui.photo=null}render();window.scrollTo(0,0)}
function renderNav(){
  const n=$('#nav');n.hidden=false;
  n.innerHTML=TABS.map(t=>`<button class="${ui.tab===t.id?'on':''}" data-go="${t.id}"><span class="i">${t.i}</span>${t.l}</button>`).join('');
}
function render(fromRemote){
  if(!me.name) return;

  renderNav();
  const v={start:vStart,meds:vMeds,bark:vBark,log:vLog,notes:vNotes}[ui.tab]();
  $('#app').innerHTML=(DEMO?'<div class="demo">Demo-Modus – Einträge werden nicht gespeichert</div>':'')+v;

  const list=S.nicknames.map(n=>n.name);
  if(!list.length) return DOG;
  if(list.length===1) return list[0];
  let n; do{n=list[Math.floor(Math.random()*list.length)]}while(n===ui.nick);
  return n;
}
function pickPhoto(){
  const l=S.photos; if(l.length<2) return l[0];
  let p; do{p=l[Math.floor(Math.random()*l.length)]}while(p.name===ui.photo);
  return p;
}

/* ====== Medikamente ====== */
function slotLabel(s){return s==='bedarf'?'bei Bedarf':s==='taeglich'?'1× täglich':s+' Uhr'}
function slotsOf(m){return m.kind==='bedarf'?[]:(m.times&&m.times.length?[...m.times].sort():['taeglich'])}
/* Dosisplan (Ausschleichen / Aufdosieren): welche Stufe gilt an einem Tag?
   Stufe mit days:null = dauerhaft; start:null = Startdatum noch offen (bis dahin gilt "pre") */
function taperInfo(m,day){
  const t=m.taper; if(!t||!t.steps) return null;
  const open=t.steps.some(s=>s.days==null), totalDays=open?null:t.steps.reduce((s,x)=>s+x.days,0);
  const pre=t.pre||{mg:0,pieces:''};
  if(!t.start) return {before:true,unscheduled:true,step:pre,next:t.steps[0],nextStart:null,totalDays};
  const n=daysBetween(t.start,day);
  if(n<0) return {before:true,startsIn:-n,step:pre,next:t.steps[0],nextStart:t.start,totalDays};
  let acc=0;
  for(let i=0;i<t.steps.length;i++){
    const s=t.steps[i], base={i,step:s,total:t.steps.length,dayInStep:n-acc+1,dayTotal:n+1,totalDays};
    if(s.days==null) return {...base,permanent:true,next:null,nextStart:null};
    if(n<acc+s.days) return {...base,next:t.steps[i+1]||null,nextStart:addDays(t.start,acc+s.days)};
    acc+=s.days;
  }
  return {done:true,endDay:addDays(t.start,acc),totalDays};
}
function sollOf(m,day){
  if(m.kind!=='taper') return m.dose??'';
  const ti=taperInfo(m,day); return ti&&ti.step?fmtMg(ti.step.mg):null;
}
function taperBlock(med,ti){
  if(!ti||!ti.step) return '';
  const title=med.taper.title||'Dosisplan';
  let head, right='', prog='<div style="height:4px"></div>', next='';
  if(ti.unscheduled) head=`${esc(title)}: Start noch offen`;
  else if(ti.before) head=`${esc(title)} startet in ${ti.startsIn} Tag${ti.startsIn>1?'en':''}`;
  else if(ti.permanent) head=`Dauerhafte Dosis · Stufe ${ti.i+1}/${ti.total}`;
  else head=`Stufe ${ti.i+1}/${ti.total} · Tag ${ti.dayInStep} von ${ti.step.days}`;
  if(!ti.before&&ti.totalDays){right=`<span class="muted">Tag ${ti.dayTotal}/${ti.totalDays}</span>`;prog=`<div class="prog"><i style="width:${Math.round(ti.dayTotal/ti.totalDays*100)}%"></i></div>`}
  if(ti.unscheduled) next=`Danach ${fmtMg(ti.next.mg)} – Startdatum unter <i>Plan → ${esc(med.name)}</i> eintragen`;
  else if(ti.nextStart){const l=dayLabel(ti.nextStart);
    next=`Ab ${l==='Morgen'?'morgen ('+fmtD(ti.nextStart)+')':l}: ${ti.next?fmtMg(ti.next.mg)+(ti.next.days==null?' (dauerhaft)':''):'0 mg – fertig ausgeschlichen 🎉'}`}
  return `<div class="taper"><div class="row small"><b class="grow">${head}</b>${right}</div>${prog}
    ${ti.step.pieces?`<div class="pieces">💊 ${esc(ti.step.pieces)}</div>`:''}
    ${next?`<div class="muted small">${next}</div>`:''}</div>`;
}
function taperSteps(m){
  const t=m.taper,td=today(),st=t.start; let acc=0;
  const pre=t.pre?`<div class="st ${!st||td<st?'now':'past'}"><span>Vorher${st?' (bis '+fmtD(addDays(st,-1))+')':''}${t.pre.pieces?`<div class="muted small">${esc(t.pre.pieces)}</div>`:''}</span><b>${fmtMg(t.pre.mg)}</b></div>`:'';
  const rows=t.steps.map((s,i)=>{
    let range,cls='';
    if(!st) range=s.days==null?'danach dauerhaft':`${s.days} Tage`;
    else{const a=addDays(st,acc);
      if(s.days==null){range=`ab ${fmtD(a)} dauerhaft`;cls=a<=td?'now':''}
      else{const b=addDays(st,acc+s.days-1);range=`${fmtD(a)}–${fmtD(b)} <span class="muted">(${s.days} T.)</span>`;cls=b<td?'past':a<=td?'now':''}}
    if(s.days!=null) acc+=s.days;
    return `<div class="st ${cls}"><span>${i+1}. ${range}${s.pieces?`<div class="muted small">${esc(s.pieces)}</div>`:''}</span><b>${fmtMg(s.mg)}</b></div>`}).join('');
  const finite=!t.steps.some(s=>s.days==null);
  const end=finite&&st?`<div class="st ${addDays(st,acc)<=td?'now':''}"><span>Ende ab ${fmtD(addDays(st,acc))}</span><b>0 mg 🎉</b></div>`:'';
  return pre+rows+end;
}
function medStatus(day){
  const items=[];
  S.meds.filter(m=>m.active!==false&&m.kind!=='bedarf').forEach(m=>{
    const soll=sollOf(m,day); if(soll==null) return;
    slotsOf(m).forEach(slot=>{
      const log=S.med_logs.find(l=>l.med_id===m.id&&l.day===day&&l.slot===slot);
      items.push({med:m,slot,log,soll});
    });
  });
  items.sort((a,b)=>a.slot.localeCompare(b.slot));
  return {items,total:items.length,done:items.filter(i=>i.log).length,open:items.filter(i=>!i.log)};
}
function vMeds(){
  if(ui.editPlan) return vPlan();
  const day=ui.medDay, st=medStatus(day), bedarf=S.meds.filter(m=>m.active!==false&&m.kind==='bedarf');
  const cards=st.items.map(({med,slot,log,soll})=>{
    const diff=log&&log.amount!==soll;
    const ti=med.kind==='taper'?taperInfo(med,day):null;
    const taper=taperBlock(med,ti);
    return `<div class="card med ${log?'done':''}">
      <div class="row"><div class="grow"><div class="name">${esc(med.name)}</div><div class="slot">${esc(slotLabel(slot))}${med.remind_at?' · 🔔 '+esc(med.remind_at):''}${med.note?' · '+esc(med.note):''}</div></div>
        ${log?`<span class="pill ${log.skipped?'warn':diff?'warn':'ok'}">${log.skipped?'ausgelassen':diff?'abweichend':'gegeben'}</span>`:'<span class="pill">offen</span>'}</div>
      ${taper}
      <dl class="sollist"><dt>Soll</dt><dd>${esc(soll||'–')}</dd>
        ${log?`<dt>Ist</dt><dd>${log.skipped?'nicht gegeben':esc(log.amount)}</dd><dt></dt><dd class="stamp">🕒 ${hm(log.created_at)} Uhr · ${esc(log.author)}${log.note?' · '+esc(log.note):''}</dd>`:''}</dl>
      ${log?`<div class="actions"><button class="btn plain" data-a="undoLog" data-id="${log.id}">Rückgängig</button></div>`:
      `<div class="actions"><button class="btn ok" data-a="giveAsPlanned" data-med="${med.id}" data-slot="${esc(slot)}">✓ Wie geplant</button>
        <button class="btn ghost" data-a="giveOther" data-med="${med.id}" data-slot="${esc(slot)}">Andere Menge</button></div>`}
    </div>`}).join('');
  const bed=bedarf.map(med=>{
    const logs=S.med_logs.filter(l=>l.med_id===med.id&&l.day===day);
    return `<div class="card med"><div class="row"><div class="grow"><div class="name">${esc(med.name)}</div><div class="slot">Soll: ${esc(med.dose||'–')}${med.note?' · '+esc(med.note):''}</div></div>
      <button class="btn ghost" data-a="giveOther" data-med="${med.id}" data-slot="bedarf">Gegeben</button></div>
      ${logs.length?`<div class="list" style="margin-top:8px">${logs.map(l=>`<div class="li"><span class="grow">${esc(l.amount)}<div class="stamp">🕒 ${hm(l.created_at)} Uhr · ${esc(l.author)}${l.note?' · '+esc(l.note):''}</div></span><button class="btn plain" data-a="undoLog" data-id="${l.id}">✕</button></div>`).join('')}</div>`:''}
    </div>`}).join('');
  return `<div class="topbar"><h1>Medikamente</h1><button class="btn ghost" data-a="plan">Plan</button></div>
  ${dateNav('medDay',day)}
  ${!S.meds.length?`<div class="card empty">Noch kein Medikamentenplan.<br><br><button class="btn" data-a="medEdit">+ Medikament anlegen</button></div>`:''}
  ${st.total?`<h2>${st.done}/${st.total} gegeben</h2>${cards}`:''}
  ${S.meds.filter(m=>m.kind==='taper'&&m.active!==false&&taperInfo(m,day)?.done).map(m=>`<div class="card"><b>${esc(m.name)}</b> ist ausgeschlichen 🎉<div class="muted small">seit ${fmtD(taperInfo(m,day).endDay)}</div></div>`).join('')}
  ${bedarf.length?`<h2>Bei Bedarf</h2>${bed}`:''}`;
}
function dateNav(key,day){
  return `<div class="datenav"><button data-a="dayShift" data-k="${key}" data-n="-1">‹</button>
    <span class="d">${dayLabel(day)}</span>
    <button data-a="dayShift" data-k="${key}" data-n="1" ${day>=today()?'disabled':''}>›</button></div>`;
}
function vPlan(){
  const list=S.meds.map(m=>`<div class="card"><div class="row"><div class="grow">
      <div style="font-weight:700">${esc(m.name)} ${m.active===false?'<span class="pill">pausiert</span>':''}</div>
      <div class="muted small">${m.kind==='taper'?esc(m.taper?.title||'Dosisplan'):esc(m.dose||'–')} · ${m.kind==='bedarf'?'bei Bedarf':slotsOf(m).map(slotLabel).join(', ')}</div></div>
      <button class="btn ghost" data-a="medEdit" data-id="${m.id}">Bearbeiten</button></div>
      ${m.kind==='taper'&&m.taper?`<div class="steps">${taperSteps(m)}</div>`:''}</div>`).join('');
  return `<div class="topbar"><h1>Plan</h1><button class="btn ghost" data-a="plan">Fertig</button></div>
    ${list||'<div class="card empty">Noch nichts eingetragen</div>'}
    <button class="btn block" data-a="medEdit" style="margin-top:8px">+ Medikament hinzufügen</button>`;
}

/* ====== Bellistima ====== */
function vBark(){
  const t=today(), todays=S.barks.filter(b=>dayOf(b.created_at)===t).sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const days=[...Array(7)].map((_,i)=>addDays(t,i-6));
  const counts=days.map(d=>S.barks.filter(b=>dayOf(b.created_at)===d).length), max=Math.max(1,...counts);
  const byReason=allReasons().map(r=>({...r,n:todays.filter(b=>b.reason===r.key).length})).filter(r=>r.n);
  return `<h1>Bellistima</h1>
  <div class="card barkhero">
    <div class="muted small">Heute gebellt</div><div class="barkcount">${todays.length}×</div>
    <button class="barkbtn" data-a="bark">+1<span>Wuff!</span></button>
    <div><button class="btn plain small" data-a="reasons">Gründe bearbeiten</button></div>
    ${byReason.length?`<div class="chips" style="justify-content:center;margin-top:10px">${byReason.map(r=>`<span class="pill">${r.icon} ${esc(r.label)}: <b>${r.n}</b></span>`).join('')}</div>`:''}
  </div>
  <h2>Letzte 7 Tage</h2>
  <div class="card"><div class="bars">${days.map((d,i)=>`<div class="b ${d===t?'today':''}"><em>${counts[i]||''}</em><i style="height:${counts[i]/max*80}%"></i>${d===t?'heute':wd(d)}</div>`).join('')}</div></div>
  ${todays.length?`<h2>Heute</h2><div class="card list">${todays.map(b=>{const r=reasonOf(b.reason);
    return `<div class="li"><span style="font-size:20px">${r.icon}</span><span class="grow">${esc(r.label)}<div class="muted small">${hm(b.created_at)} · ${esc(b.author)}</div></span>
    <button class="btn plain" data-a="delBark" data-id="${b.id}">✕</button></div>`}).join('')}</div>`:''}`;
}

  const f=ui.logForm && ui.logForm.day===day ? ui.logForm : (ui.logForm={day,mood:lg?.mood||0,tags:[...(lg?.tags||[])],text:lg?.text||''});
  const hist=[...S.daily_log].sort((a,b)=>b.day.localeCompare(a.day)).slice(0,14);
  return `<div class="topbar"><h1>Protokoll</h1><button class="btn ghost" data-a="exportXlsx">📊 Excel</button></div>
  ${dateNav('logDay',day)}
  <div class="card">
    <label class="f" style="margin-top:2px">Wie war ${esc(DOG)} ${day===today()?'heute':'an dem Tag'}?</label>
    <div class="moods">${MOODS.map(m=>`<button class="${f.mood===m.v?'on':''}" data-a="mood" data-v="${m.v}">${m.e}<small>${m.l}</small></button>`).join('')}</div>
    <label class="f">Was trifft zu?</label>
    <div class="chips">${TAGS.map(t=>`<button class="chip ${f.tags.includes(t)?'on':''}" data-a="tag" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <label class="f">Wie hat sie sich verhalten?</label>
    <textarea id="logText" placeholder="Spaziergang, Fressen, Besonderheiten …">${esc(f.text)}</textarea>
    <button class="btn block" data-a="saveLog" style="margin-top:12px">${lg?'Aktualisieren':'Speichern'}</button>
    ${lg?`<div class="muted small" style="text-align:center;margin-top:8px">Zuletzt von ${esc(lg.author)}</div>`:''}
  </div>
  ${hist.length?`<h2>Verlauf</h2><div class="card list">${hist.map(h=>{const m=MOODS.find(x=>x.v===h.mood);
    return `<button class="li" style="width:100%;text-align:left" data-a="openLog" data-day="${h.day}"><span style="font-size:24px">${m?m.e:'·'}</span>
    <span class="grow"><b>${dayLabel(h.day)}</b><div class="muted small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc([...(h.tags||[])].join(', ')||h.text||'')}</div></span><span class="muted">›</span></button>`}).join('')}</div>`:''}`;
}
document.addEventListener('input',e=>{if(e.target.id==='logText'&&ui.logForm){ui.logForm.text=e.target.value;ui.logDirty=true}});

/* ====== Notizen ====== */

  const list=[...S.notes].sort((a,b)=>(b.pinned-a.pinned)||(b.updated_at||b.created_at).localeCompare(a.updated_at||a.created_at));
  return `<div class="topbar"><h1>Notizen</h1><button class="btn" data-a="noteEdit">+ Neu</button></div>
  ${list.length?list.map(n=>`<button class="card note" style="display:block;width:100%;text-align:left" data-a="noteEdit" data-id="${n.id}">
    <div class="row"><div class="t grow">${n.pinned?'📌 ':''}${esc(n.title||'Ohne Titel')}</div></div>
    ${n.body?`<div class="b">${esc(n.body.length>220?n.body.slice(0,220)+' …':n.body)}</div>`:''}
    <div class="muted small" style="margin-top:8px">${esc(n.author)} · ${new Date(n.updated_at||n.created_at).toLocaleDateString('de-DE',{day:'numeric',month:'short'})}</div></button>`).join('')
  :'<div class="card empty">Noch keine Notizen.<br>Z. B. Tierarzt-Termine, Futter, Tricks …</div>'}`;

/* ====== Aktionen ====== */
const ACT = {
  reroll(){
    const h=document.querySelector('.hero'); if(!h||(S.nicknames.length<2&&S.photos.length<2))return;
    h.classList.add('swap');
    setTimeout(()=>{ui.nick=pickNick();if(S.photos.length>1)ui.photo=pickPhoto().name;render();
      const n=document.querySelector('.hero');n.classList.add('swap');requestAnimationFrame(()=>requestAnimationFrame(()=>n.classList.remove('swap')))},180);
  },
  dayShift(d){const k=d.k;ui[k]=addDays(ui[k],+d.n);if(ui[k]>today())ui[k]=today();if(k==='logDay'){ui.logForm=null;ui.logDirty=false}render()},
  plan(){ui.editPlan=!ui.editPlan;render()},
  async giveAsPlanned(d){const m=S.meds.find(x=>x.id===d.med);await ins('med_logs',{med_id:m.id,day:ui.medDay,slot:d.slot,amount:sollOf(m,ui.medDay)||'✓'});toast(`${m.name} um ${hm(new Date())} eingetragen ✅`)},
  giveOther(d){
    const m=S.meds.find(x=>x.id===d.med), soll=sollOf(m,ui.medDay)||'';
    const now=hm(new Date());
    openSheet(`<h3>${esc(m.name)}</h3><div class="muted">${esc(slotLabel(d.slot))} · Soll: ${esc(soll||'–')}</div>
      <label class="f">Tatsächlich gegeben</label><input type="text" id="amt" value="${esc(soll)}">
      <label class="f">Gegeben um</label><input type="time" id="gt" value="${now}" style="max-width:150px">
      <label class="f">Notiz (optional)</label><input type="text" id="nt" placeholder="z. B. halbe Tablette ausgespuckt">
      <button class="btn block" id="save" style="margin-top:16px">Speichern</button>
      ${d.slot!=='bedarf'?'<button class="btn block plain" id="skip" style="margin-top:4px">Heute nicht gegeben</button>':''}`, sh=>{
      const at=()=>{const v=sh.querySelector('#gt').value||now;return new Date(`${ui.medDay}T${v}:00`).toISOString()};
      sh.querySelector('#save').onclick=async()=>{await ins('med_logs',{med_id:m.id,day:ui.medDay,slot:d.slot,amount:sh.querySelector('#amt').value.trim()||'–',note:sh.querySelector('#nt').value.trim()||null,created_at:at()});closeSheet()};
      const sk=sh.querySelector('#skip'); if(sk) sk.onclick=async()=>{await ins('med_logs',{med_id:m.id,day:ui.medDay,slot:d.slot,amount:'0',skipped:true,note:sh.querySelector('#nt').value.trim()||null,created_at:at()});closeSheet()};
    });
  },
  undoLog(d){del('med_logs',d.id)},
  medEdit(d){
    if(d.id&&S.meds.find(x=>x.id===d.id)?.kind==='taper') return ACT.taperEdit(d);
    const m=d.id?S.meds.find(x=>x.id===d.id):{name:'',dose:'',kind:'taeglich',times:['08:00'],note:'',active:true};
    let times=[...(m.times||[])], kind=m.kind||'taeglich';
    const timesHtml=()=>times.map((t,i)=>`<div class="row" style="margin-bottom:6px"><input type="time" value="${t}" data-i="${i}" class="tm"><button class="btn plain" data-rm="${i}">✕</button></div>`).join('');
    openSheet(`<h3>${d.id?'Medikament bearbeiten':'Neues Medikament'}</h3>
      <label class="f">Name</label><input type="text" id="mn" value="${esc(m.name)}" placeholder="z. B. Apoquel">
      <label class="f">Soll-Menge</label><input type="text" id="md" value="${esc(m.dose||'')}" placeholder="z. B. 1 Tablette, 2 ml">
      <label class="f">Wann?</label>
      <div class="chips"><button class="chip ${kind!=='bedarf'?'on':''}" id="k1">Täglich</button><button class="chip ${kind==='bedarf'?'on':''}" id="k2">Bei Bedarf</button></div>
      <div id="tw" style="margin-top:10px;${kind==='bedarf'?'display:none':''}"><div id="tl">${timesHtml()}</div><button class="btn ghost" id="addt">+ Uhrzeit</button>

/* ====== Erinnerungen (Web Push) ====== */
function remindField(m){
  return `<label class="f">Erinnern um (falls bis dahin nicht gegeben)</label>
    <div class="row"><input type="time" id="rem" value="${esc(m.remind_at||'')}" style="max-width:150px"><button class="btn plain" type="button" onclick="this.previousElementSibling.value=''">Keine</button></div>`;
}
function remindPatch(sh,m,kind){
  const v=kind==='bedarf'?'':(sh.querySelector('#rem')?.value||'');
  return v===(m.remind_at||'')?{}:{remind_at:v||null}; // nur mitschicken, wenn geändert
}
const isStandalone=()=>window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
let swReg=null, pushSub=null;
function pushState(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))
    return {can:false,label:'nicht möglich',hint:isStandalone()?'Dein iOS ist zu alt (ab iOS 16.4).':'Funktioniert nur, wenn du die App über das Pfoten-Icon auf dem Home-Bildschirm öffnest.'};
  if(Notification.permission==='denied') return {can:false,label:'blockiert',hint:'In den iPhone-Einstellungen → Mitteilungen → Ellie erlauben.'};
  if(Notification.permission==='granted'&&pushSub) return {can:true,on:true,label:'aktiv'};
  return {can:true,label:'aus'};
}
function b64uBytes(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function saveSub(sub){
  if(DEMO) return true;
  const j=sub.toJSON();
  const {error}=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,sub:j,author:me.name,updated_at:new Date().toISOString()},{onConflict:'endpoint'});
  if(error){console.error(error);toast('Konnte Gerät nicht speichern – SQL-Update schon ausgeführt?');return false}
  return true;
}
async function enablePush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Mitteilungen nicht erlaubt');return false}
    swReg=swReg||await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    pushSub=await swReg.pushManager.getSubscription()||await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(VAPID_PUBLIC)});
    return await saveSub(pushSub);
  }catch(e){console.error(e);toast('Aktivieren fehlgeschlagen: '+(e.message||e));return false}
}
async function initPush(){
  if(!('serviceWorker' in navigator)||location.protocol==='file:') return;
  try{
    swReg=await navigator.serviceWorker.register('sw.js');
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.tab){go(e.data.tab)}});
    if('PushManager' in window&&Notification.permission==='granted'){
      pushSub=await swReg.pushManager.getSubscription();
      if(pushSub) saveSub(pushSub); // hält das Gerät aktuell
    }
  }catch(e){console.warn('SW',e)}
}
async function sendTestPush(){
  if(DEMO){toast('Im Demo-Modus nicht möglich');return}
  const {error}=await sb.from('push_tests').insert({endpoint:pushSub?.endpoint,author:me.name});
  if(error){console.error(error);toast('Test fehlgeschlagen – SQL-Update schon ausgeführt?')}
}

/* ====== Fotos (privater Supabase-Speicher "fotos") ====== */
const BUCKET='fotos';
const urlCache={};
async function loadPhotos(){
  if(DEMO) return;
  const {data,error}=await sb.storage.from(BUCKET).list('',{limit:1000,sortBy:{column:'created_at',order:'desc'}});
  if(error||!data){S.photos=[];return}
  const files=data.filter(f=>f.id&&!f.name.startsWith('.'));
  const fresh=c=>c&&Date.now()-c.t<5*864e5; // Links gelten 7 Tage, nach 5 erneuern
  const need=files.filter(f=>!fresh(urlCache[f.name])).map(f=>f.name);
  if(need.length){
    const {data:urls}=await sb.storage.from(BUCKET).createSignedUrls(need,60*60*24*7);
    (urls||[]).forEach((u,i)=>{if(u.signedUrl) urlCache[need[i]]={url:u.signedUrl,t:Date.now()}});
  }
  S.photos=files.filter(f=>urlCache[f.name]).map(f=>({name:f.name,url:urlCache[f.name].url}));
}
function shrink(file,max=1600){
  return new Promise((ok,no)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(b=>b?ok(b):no(new Error('toBlob')),'image/jpeg',0.85)};
    img.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Bild nicht lesbar'))};
    img.src=u;
  });
}
async function uploadPhoto(file){
  const blob=await shrink(file), name=`${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
  if(DEMO){S.photos.unshift({name,url:URL.createObjectURL(blob)});return}
  const {error}=await sb.storage.from(BUCKET).upload(name,blob,{contentType:'image/jpeg'});
  if(error) throw error;
  const {data}=await sb.storage.from(BUCKET).createSignedUrl(name,60*60*24*7);
  urlCache[name]={url:data.signedUrl,t:Date.now()}; S.photos.unshift({name,url:data.signedUrl});
}
async function deletePhoto(name){
  S.photos=S.photos.filter(p=>p.name!==name);
  if(DEMO) return;
  const {error}=await sb.storage.from(BUCKET).remove([name]);
  if(error){toast('Löschen fehlgeschlagen');await loadPhotos()}
}

/* ====== Excel-Export ====== */
function buildExport(dlogs,meds,mlogs,barks){
  const D=day=>new Date(day+'T12:00:00'), medById=Object.fromEntries(meds.map(m=>[m.id,m]));
  const usedKeys=new Set(barks.map(b=>b.reason));
  const RS=allReasons().filter(r=>r.active!==false||usedKeys.has(r.key));
  const days=[...new Set([...dlogs.map(l=>l.day),...mlogs.map(l=>l.day),...barks.map(b=>dayOf(b.created_at))])].sort();
  const protokoll=days.map(day=>{
    const lg=dlogs.find(l=>l.day===day), mood=lg&&MOODS.find(m=>m.v===lg.mood);
    const bs=barks.filter(b=>dayOf(b.created_at)===day);
    const row={'Datum':D(day),'Wochentag':wd(day),'Stimmung':mood?`${mood.v} – ${mood.l}`:'','Merkmale':(lg?.tags||[]).join(', '),'Beschreibung':lg?.text||'','Gebellt':bs.length};
    RS.forEach(r=>row['davon: '+r.label]=bs.filter(b=>b.reason===r.key).length);
    row['Medikamente gegeben']=mlogs.filter(l=>l.day===day).map(l=>`${medById[l.med_id]?.name||'?'}: ${l.skipped?'nicht gegeben':l.amount}`).join('; ');
    row['Eingetragen von']=lg?.author||'';
    return row;
  });
  const medis=[...mlogs].sort((a,b)=>(a.day+a.slot).localeCompare(b.day+b.slot)).map(l=>{const m=medById[l.med_id];const soll=m?sollOf(m,l.day):'';
    return {'Datum':D(l.day),'Medikament':m?.name||'(gelöscht)','Zeitpunkt':slotLabel(l.slot),'Soll':soll||'','Ist':l.skipped?'nicht gegeben':l.amount,
      'Status':l.skipped?'ausgelassen':l.amount===soll?'wie geplant':'abweichend','Notiz':l.note||'','Von':l.author||'','Eingetragen um':hm(l.created_at)}});
  const bell=[...barks].sort((a,b)=>a.created_at.localeCompare(b.created_at)).map(b=>({'Datum':D(dayOf(b.created_at)),'Uhrzeit':hm(b.created_at),'Grund':reasonOf(b.reason).label,'Von':b.author||''}));
  const sheet=(rows,widths)=>{const ws=XLSX.utils.json_to_sheet(rows,{cellDates:true,dateNF:'dd.mm.yyyy'});ws['!cols']=widths.map(w=>({wch:w}));return ws};
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,sheet(protokoll,[11,10,13,32,50,8,...RS.map(()=>14),40,14]),'Protokoll');
  XLSX.utils.book_append_sheet(wb,sheet(medis,[11,16,12,12,14,13,30,10,14]),'Medikamente');
  XLSX.utils.book_append_sheet(wb,sheet(bell,[11,8,22,10]),'Bellistima');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array',cellDates:true});
  const file=new File([buf],`${DOG}_Protokoll_${today()}.xlsx`,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  return {file,stats:{days:days.length,logs:dlogs.length,meds:mlogs.length,barks:barks.length}};
}

/* ====== Login & Start ====== */
async function setName(n){
  me.name=n; lsSet('ellie.name',n);
  if(!DEMO) await sb.auth.updateUser({data:{name:n}});
}
function showLogin(err){
  $('#nav').hidden=true;
  $('#app').innerHTML=`<div class="login"><div class="paw">🐾</div><h1>${esc(DOG)}</h1>
    <form id="lf"><label class="f">E-Mail</label><input type="email" id="le" autocomplete="username" required>
    <label class="f">Passwort</label><input type="password" id="lp" autocomplete="current-password" required>
    ${err?`<div style="color:var(--danger);margin-top:10px" class="small">${esc(err)}</div>`:''}
    <button class="btn block" style="margin-top:16px">Anmelden</button></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
    if(error) showLogin('Anmeldung fehlgeschlagen – E-Mail oder Passwort falsch?'); else boot();
  };
}
function askName(){
  $('#nav').hidden=true;
  $('#app').innerHTML=`<div class="login"><div class="paw">👋</div><h1>Wer bist du?</h1>
    <div class="muted">Damit der andere sieht, wer was eingetragen hat.</div>
    <form id="nf"><input type="text" id="nm" placeholder="Dein Name" required style="margin-top:20px">
    <button class="btn block" style="margin-top:12px">Weiter</button></form></div>`;
  $('#nf').onsubmit=async e=>{e.preventDefault();const n=$('#nm').value.trim();if(n){await setName(n);boot()}};
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.append(s)})}

async function boot(){
  if(DEMO){
    me.name=lsGet('ellie.name')||'Dennis';
    if(!S.nicknames.length) seedDemo();
    render(); initPush(); return;
  }
  if(!sb){
    try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')}
    catch(e){$('#app').innerHTML='<div class="login"><div class="paw">📡</div><h1>Keine Verbindung</h1><div class="muted">Bitte Internet prüfen und neu öffnen.</div></div>';return}
    sb=supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}});
  }
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return showLogin();
  me.name=session.user.user_metadata?.name||'';
  if(!me.name) return askName();
  $('#app').innerHTML='<div class="empty" style="margin-top:30vh">🐾 lädt …</div>';
  await loadAll(); render(); subscribe(); initPush();
}
// Beim Zurückkehren in die App alles neu laden (iOS trennt die Live-Verbindung im Hintergrund)
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||DEMO||!sb||!me.name) return;
  await loadAll(); render(true);
});

function seedDemo(){
  const now=Date.now(), iso=ms=>new Date(ms).toISOString(), t=today();
  DEFAULT_REASONS.forEach((r,i)=>S.bark_reasons.push({...r,id:uid(),active:true,created_at:iso(now-9e8+i)}));
  NICKS.forEach(name=>S.nicknames.push({id:uid(),name,author:'Dennis',created_at:iso(now)}));
  const m1={id:uid(),name:'Alprazolam',dose:null,kind:'taper',times:[],taper:ALPRA_TAPER,note:'Auffälligkeiten sofort Dr. Feist melden',active:true,author:'Jana'};
  S.meds.push(m1,
    {id:uid(),name:'Fluoxetin',kind:'taper',times:[],taper:FLUOX_PLAN,active:true,author:'Dennis'},
    {id:uid(),name:'Vitamin B12',dose:'1 Streukapsel',kind:'taeglich',times:[],active:true,author:'Dennis'},
    {id:uid(),name:'Trazodon',dose:null,kind:'bedarf',times:[],note:'Nur im Notfall (z. B. Tierarzt)',active:true,author:'Dennis'});
  [1,2,3].forEach(i=>{const d=addDays(t,-i);S.med_logs.push({id:uid(),med_id:m1.id,day:d,slot:'taeglich',amount:sollOf(m1,d),author:i%2?'Jana':'Dennis',created_at:iso(now-i*864e5)})});
  const rs=['hausflur','draussen','hausflur','draussen','hausflur'];
  for(let d=0;d<7;d++){const n=[3,1,4,2,0,5,2][d];for(let i=0;i<n;i++)S.barks.push({id:uid(),reason:rs[(i+d)%5],author:i%2?'Jana':'Dennis',created_at:iso(now-d*864e5-i*2400e3)})}
  S.daily_log.push({id:uid(),day:addDays(t,-1),mood:4,tags:['Verspielt','Gut gefressen'],text:'Langer Spaziergang im Wald, danach total platt.',author:'Jana',created_at:iso(now-864e5)});
  S.daily_log.push({id:uid(),day:addDays(t,-2),mood:2,tags:['Ängstlich','Viel gebellt'],text:'Handwerker im Haus.',author:'Dennis',created_at:iso(now-2*864e5)});
  S.notes.push({id:uid(),title:'Tierarzt',body:'Kontrolle Haut: nächster Termin in 4 Wochen.\nPraxis fragt nach Gewicht.',pinned:true,author:'Jana',created_at:iso(now-3*864e5)});
}

boot();
