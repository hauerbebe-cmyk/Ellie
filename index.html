<style>
:root{
  --bg:#fbf6ee; --card:#ffffff; --ink:#2b2520; --muted:#73685d; --line:#ebe2d4;
  --accent:#cf6a2e; --accent-soft:#fbe6d6; --accent-ink:#b4561f; --ok:#3f9a5d; --ok-soft:#dff1e4;
  --warn:#c98a12; --warn-soft:#fbefd2; --danger:#c24a3a;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --r:18px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1c1915; --card:#29241f; --ink:#f3ece3; --muted:#b5a998; --line:#3a332c;
  --accent:#ec8a50; --accent-soft:#45291a; --accent-ink:#f4a575; --ok:#6cc58a; --ok-soft:#1f3a28;
  --warn:#e8b34a; --warn-soft:#45381a; --danger:#ef7a68;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;font-size:16px;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px);max-width:560px;margin:0 auto}
h1{font-size:28px;margin:4px 0 14px;letter-spacing:-.02em}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--accent-soft);color:var(--accent-ink)}
.btn.plain{background:transparent;color:var(--muted);padding:8px}
.btn.ok{background:var(--ok);}
.btn.block{width:100%;padding:14px;font-size:17px}
.btn.danger{background:transparent;color:var(--danger)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:13px;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.topbar{display:flex;align-items:center;justify-content:space-between}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:19px}
input[type=text],input[type=email],input[type=password],input[type=time],input[type=date],input[type=url],textarea{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none;font-size:16px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 2px 6px}

/* Tabbar */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:space-around;z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:4px 0;font-weight:500}
nav button .i{width:44px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
nav button .i svg{width:24px;height:24px}
nav button.on{color:var(--accent-ink);font-weight:700}
nav button.on .i{background:var(--accent-soft)}

/* Start */
.hero{text-align:center;padding:30px 10px 26px}
.hero .hi{color:var(--muted);font-size:15px}
.hero .nick{font-size:clamp(34px,11vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:10px 0 8px;
  color:var(--accent);word-break:normal;overflow-wrap:break-word;hyphens:auto;transition:opacity .2s,transform .2s}
.hero .photo,.hero .nick{transition:opacity .18s,transform .18s}
.hero.swap .photo,.hero.swap .nick{opacity:0;transform:scale(.96)}
.hero.withphoto{padding-top:6px}
.hero .photo{width:100%;aspect-ratio:4/5;max-height:42vh;border-radius:24px;overflow:hidden;margin:0 auto 16px;background:var(--line);box-shadow:var(--shadow)}
.hero .photo img{width:100%;height:100%;object-fit:cover;display:block}
.addphoto{width:100%;text-align:center;color:var(--accent);font-weight:600;border-style:dashed;margin-bottom:14px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.pgrid .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px}
.hero .tip{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;text-align:left}
.tile .big{font-size:28px;font-weight:800;margin:4px 0 0}
.tile .lbl{font-size:13px;color:var(--muted)}
.tile.wide{grid-column:1/-1}

/* Date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.datenav button{width:40px;height:36px;border-radius:10px;font-size:20px;color:var(--accent)}
.datenav button:disabled{opacity:.25}
.datenav .d{font-weight:600}

/* Meds */
.med.done{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.med .name{font-weight:700;font-size:17px}
.med .slot{font-size:13px;color:var(--muted)}
.sollist{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 10px;font-size:15px}
.sollist dt{color:var(--muted)} .sollist dd{margin:0;font-weight:600}
.stamp{font-size:13px;font-weight:600;color:var(--ok);margin-top:2px}
.actions{display:flex;gap:8px}
.taper{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0 4px}
.prog{height:6px;border-radius:9px;background:var(--line);margin:8px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:9px}
.pieces{font-weight:600;font-size:15px;margin-bottom:4px}
.steps{margin-top:10px}
.steps .st{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.steps .st.past{opacity:.4}
.steps .st.now{color:var(--accent)}
.steps .st.now b{font-weight:800}
.actions .btn{flex:1}

/* Bark */
.barkhero{text-align:center;padding:10px 0 4px}
.barkcount{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.03em}
.barkbtn{width:170px;height:170px;border-radius:50%;background:var(--accent);color:#fff;font-size:34px;font-weight:800;
  box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 45%,transparent);margin:18px auto 8px;display:grid;place-items:center;
  transition:transform .12s}
.barkbtn:active{transform:scale(.94)}
.barkbtn span{display:block;font-size:14px;font-weight:600;opacity:.9}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.bars .b i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--accent);min-height:3px;opacity:.85}
.bars .b.today i{opacity:1}
.bars .b em{font-style:normal;font-weight:700;color:var(--ink);font-size:12px}
.reason{width:100%;text-align:left;padding:16px;border-radius:14px;background:var(--bg);border:1px solid var(--line);margin-bottom:8px;font-size:17px;font-weight:600;display:flex;gap:12px;align-items:center}
.reason:active{background:var(--accent-soft)}
.reason.newreason{background:transparent;border-style:dashed;color:var(--accent)}
.chip.iconchip{font-size:22px;padding:6px 10px}
.list .li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}

/* Protokoll */
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;padding:10px 0 8px;border-radius:14px;background:var(--bg);border:2px solid transparent;font-size:28px;display:flex;flex-direction:column;align-items:center;gap:2px}
.moods button small{font-size:10px;color:var(--muted)}
.moods button.on{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Protokoll – Abschnitte */
.lsec{padding:14px 14px 16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;min-height:24px}
.sec-h>span:first-child{font-weight:800;font-size:15px;letter-spacing:-.01em}
.sec-h .btn.plain{padding:2px 4px;font-size:13px}
.chip .ci{margin-right:5px}
.chip.sym.on{background:var(--danger);border-color:var(--danger);color:#fff}
.chip.addchip{border-style:dashed;color:var(--accent);background:transparent}
.mf{width:100%;max-width:46px;height:auto;display:block}
.moods button{padding:8px 0 6px}
.moods button:not(.on) .mf{filter:saturate(.85)}
.mfbig .mf{width:44px;max-width:44px}
.li.hist .hm .mf{width:34px}
.stools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border-radius:14px;background:var(--bg);border:2px solid transparent}
.sb .st{width:100%;max-width:50px;height:auto}
.sb small{font-size:12px;color:var(--muted);font-weight:600}
.sb.on{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}.sb.on small{color:var(--warn)}
.sb.on.sv2{border-color:var(--ok);background:var(--ok-soft)}.sb.on.sv2 small{color:var(--ok)}
.sb.on.sv1,.sb.on.sv4,.sb.on.sv5{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.sb.on.sv1 small,.sb.on.sv4 small,.sb.on.sv5 small{color:var(--danger)}
.bowls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bw{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:16px;background:var(--bg);border:2px solid transparent;transition:transform .12s}
.bw:active{transform:scale(.95)}
.bw small{font-size:12px;color:var(--muted);font-weight:600}
.bw.on{border-color:var(--accent);background:var(--accent-soft)}
.bw.on small{color:var(--accent)}
.bw.on.lv0,.bw.on.lv1{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.bw.on.lv0 small,.bw.on.lv1 small{color:var(--danger)}
.bowl{width:100%;max-width:64px;height:auto}
.bowl .bin{fill:color-mix(in srgb,var(--ink) 6%,transparent)}
.bowl .food{fill:#d39a5b}.bowl .kib{fill:#9c6127}
.bowl .rim{fill:none;stroke:var(--ink);stroke-opacity:.25;stroke-width:1.6}
.bowl .lip{fill:var(--muted);opacity:.5}
.bw.on .bowl .lip{fill:var(--accent);opacity:1}
/* Warnungen */
.alert{display:block;width:100%;text-align:left;border-radius:18px;padding:12px 14px;margin-bottom:12px;color:#fff;
  background:linear-gradient(135deg,#d2553f,#e88a3c);box-shadow:0 6px 18px rgba(210,85,63,.25)}
.alert-h{font-weight:800;font-size:15px}.alert-b{font-size:15px;margin-top:3px;font-weight:600}.alert-f{font-size:12px;opacity:.9;margin-top:4px}
.stockalert{background:linear-gradient(135deg,#7a5af0,#b05be0);box-shadow:0 6px 18px rgba(122,90,240,.25)}
/* Wetter */
.wx{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border-radius:20px;padding:14px 16px;margin-bottom:10px;color:#fff;position:relative;overflow:hidden}
.wx::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.wx-sun{background:linear-gradient(135deg,#f6a03c,#f3c24b)}
.wx-cloud{background:linear-gradient(135deg,#7f8fa6,#a3b1c2)}
.wx-fog{background:linear-gradient(135deg,#9aa3ad,#c3c9cf)}
.wx-rain{background:linear-gradient(135deg,#3f6fb5,#5d9bd5)}
.wx-snow{background:linear-gradient(135deg,#7fa9d6,#bcd7f0)}
.wx-storm{background:linear-gradient(135deg,#3a2f6b,#6b4fa8)}
.wx-none{background:var(--card);color:var(--muted);border:1px solid var(--line);font-size:13px}
.wx-ic{font-size:40px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.wx-t{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1}.wx-t span{font-size:17px;opacity:.85;font-weight:600}
.wx-l{font-size:13px;opacity:.95;margin-top:3px}
.wx-side{font-size:13px;text-align:right;line-height:1.5;opacity:.95;z-index:1}
.wx-flags{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;z-index:1}
.wx-flags span{background:rgba(255,255,255,.22);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.wx2{border-radius:16px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.wx2.calm{display:flex;align-items:center;gap:10px;font-size:14px}
.wx2 .wi{font-size:20px;width:26px;text-align:center;flex:none}
.wx2.red{background:color-mix(in srgb,var(--danger) 9%,var(--card));border-color:color-mix(in srgb,var(--danger) 30%,var(--line));border-left:5px solid var(--danger)}
.wx2.warn{background:color-mix(in srgb,var(--warn) 10%,var(--card));border-left:5px solid var(--warn)}
.wf{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px;font-weight:600}
.wf.red{color:var(--danger)}
.wxchip{font-size:13px;color:var(--muted);font-weight:600}
/* Verlauf */
.li.hist{width:100%;text-align:left;align-items:flex-start}
.li.hist .hm{font-size:26px;line-height:1.2}
.hsub{display:flex;gap:8px;align-items:center;margin-top:3px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.hsub .hb{flex:none}.hsub .hs{flex:none;letter-spacing:1px}.hsub .ht{overflow:hidden;text-overflow:ellipsis}
/* Vorrat */
.stk .stk-n{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stk .stk-n small{font-size:13px;color:var(--muted);font-weight:600}
.stk-bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 8px}
.stk-bar i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.stk.lv-warn .stk-bar i{background:var(--warn)}.stk.lv-red .stk-bar i{background:var(--danger)}
.stk-t{font-weight:700;font-size:14px}
.stk.lv-red .stk-t{color:var(--danger)}.stk.lv-warn .stk-t{color:var(--warn)}
.stk.lv-red{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}

/* Notes */
.note .t{font-weight:700;font-size:17px}
.note .b{white-space:pre-wrap;margin-top:4px;line-height:1.4}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(20,12,4,.38);z-index:20;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;

  const {data,error} = await sb.from(t).insert(row).select().single();
  if(error){console.error(error);toast('Speichern fehlgeschlagen');return null}
  putLocal(t,data);render();return data;
}
async function insMany(t,rows){
  rows=rows.map(r=>({author:me.name,...r}));
  if(DEMO){rows.forEach(r=>{r.id=uid();r.created_at=new Date().toISOString();S[t].push(r)});render();return}
  const {data,error}=await sb.from(t).insert(rows).select();
  if(error){console.error(error);toast('Speichern fehlgeschlagen');return}
  data.forEach(r=>putLocal(t,r));render();
}
async function upd(t,id,patch){
  if(DEMO){Object.assign(S[t].find(r=>r.id===id),patch);render();return}
  const {data,error} = await sb.from(t).update(patch).eq('id',id).select().single();
  if(error){console.error(error);toast('Speichern fehlgeschlagen');return}
  putLocal(t,data);render();
}
async function del(t,id){
  S[t]=S[t].filter(r=>r.id!==id);
  if(t==='meds') S.med_logs=S.med_logs.filter(l=>l.med_id!==id);
  render();
  if(DEMO) return;
  const {error} = await sb.from(t).delete().eq('id',id);
  if(error){console.error(error);toast('Löschen fehlgeschlagen');loadTable(t).then(render)}
}
function subscribe(){
  if(DEMO) return;
  const ch = sb.channel('ellie');
  TABLES.forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},p=>{
    if(p.eventType==='DELETE') S[t]=S[t].filter(r=>r.id!==p.old.id); else putLocal(t,p.new);
    render(true);
  }));
  ch.subscribe();
}

/* ====== Medikamente ====== */
function slotLabel(s){return s==='bedarf'?'bei Bedarf':s==='taeglich'?'1× täglich':s+' Uhr'}
function slotsOf(m){return m.kind==='bedarf'?[]:(m.times&&m.times.length?[...m.times].sort():['taeglich'])}
/* Dosisplan (Ausschleichen / Aufdosieren): welche Stufe gilt an einem Tag?
   Stufe mit days:null = dauerhaft; start:null = Startdatum noch offen (bis dahin gilt "pre") */
function taperInfo(m,day){
  const t=m.taper; if(!t||!t.steps) return null;
  const open=t.steps.some(s=>s.days==null), totalDays=open?null:t.steps.reduce((s,x)=>s+x.days,0);
  const pre=t.pre||{mg:0,pieces:''};
  if(!t.start) return {before:true,unscheduled:true,step:pre,next:t.steps[0],nextStart:null,totalDays};
  const n=daysBetween(t.start,day);
  if(n<0) return {before:true,startsIn:-n,step:pre,next:t.steps[0],nextStart:t.start,totalDays};
  let acc=0;
  for(let i=0;i<t.steps.length;i++){
    const s=t.steps[i], base={i,step:s,total:t.steps.length,dayInStep:n-acc+1,dayTotal:n+1,totalDays};
    if(s.days==null) return {...base,permanent:true,next:null,nextStart:null};
    if(n<acc+s.days) return {...base,next:t.steps[i+1]||null,nextStart:addDays(t.start,acc+s.days)};
    acc+=s.days;
  }
  return {done:true,endDay:addDays(t.start,acc),totalDays};
}
function sollOf(m,day){
  if(m.kind!=='taper') return m.dose??'';
  const ti=taperInfo(m,day); return ti&&ti.step?fmtMg(ti.step.mg):null;
}
function taperBlock(med,ti,noPieces){
  if(!ti||!ti.step) return '';
  const title=med.taper.title||'Dosisplan';
  let head, right='', prog='<div style="height:4px"></div>', next='';
  if(ti.unscheduled) head=`${esc(title)}: Start noch offen`;
  else if(ti.before) head=`${esc(title)} startet in ${ti.startsIn} Tag${ti.startsIn>1?'en':''}`;
  else if(ti.permanent) head=`Dauerhafte Dosis · Stufe ${ti.i+1}/${ti.total}`;
  else head=`Stufe ${ti.i+1}/${ti.total} · Tag ${ti.dayInStep} von ${ti.step.days}`;
  if(!ti.before&&ti.totalDays){right=`<span class="muted">Tag ${ti.dayTotal}/${ti.totalDays}</span>`;prog=`<div class="prog"><i style="width:${Math.round(ti.dayTotal/ti.totalDays*100)}%"></i></div>`}
  if(ti.unscheduled) next=`Danach ${fmtMg(ti.next.mg)} – Startdatum unter <i>Plan → ${esc(med.name)}</i> eintragen`;
  else if(ti.nextStart){const l=dayLabel(ti.nextStart);
    next=`Ab ${l==='Morgen'?'morgen ('+fmtD(ti.nextStart)+')':l}: ${ti.next?fmtMg(ti.next.mg)+(ti.next.days==null?' (dauerhaft)':''):'0 mg – fertig ausgeschlichen 🎉'}`}
  return `<div class="taper"><div class="row small"><b class="grow">${head}</b>${right}</div>${prog}
    ${ti.step.pieces&&!noPieces?`<div class="pieces">💊 ${esc(ti.step.pieces)}</div>`:''}
    ${next?`<div class="muted small">${next}</div>`:''}</div>`;
}
function taperSteps(m){
  const t=m.taper,td=today(),st=t.start; let acc=0;
  const pre=t.pre?`<div class="st ${!st||td<st?'now':'past'}"><span>Vorher${st?' (bis '+fmtD(addDays(st,-1))+')':''}${t.pre.pieces?`<div class="muted small">${esc(t.pre.pieces)}</div>`:''}</span><b>${fmtMg(t.pre.mg)}</b></div>`:'';
  const rows=t.steps.map((s,i)=>{
    let range,cls='';
    if(!st) range=s.days==null?'danach dauerhaft':`${s.days} Tage`;
    else{const a=addDays(st,acc);
      if(s.days==null){range=`ab ${fmtD(a)} dauerhaft`;cls=a<=td?'now':''}
      else{const b=addDays(st,acc+s.days-1);range=`${fmtD(a)}–${fmtD(b)} <span class="muted">(${s.days} T.)</span>`;cls=b<td?'past':a<=td?'now':''}}
    if(s.days!=null) acc+=s.days;
    return `<div class="st ${cls}"><span>${i+1}. ${range}${s.pieces?`<div class="muted small">${esc(s.pieces)}</div>`:''}</span><b>${fmtMg(s.mg)}</b></div>`}).join('');
  const finite=!t.steps.some(s=>s.days==null);
  const end=finite&&st?`<div class="st ${addDays(st,acc)<=td?'now':''}"><span>Ende ab ${fmtD(addDays(st,acc))}</span><b>0 mg 🎉</b></div>`:'';
  return pre+rows+end;
}
function medStatus(day){
  const items=[];
  S.meds.filter(m=>m.active!==false&&m.kind!=='bedarf').forEach(m=>{
    const soll=sollOf(m,day); if(soll==null) return;
    slotsOf(m).forEach(slot=>{
      const log=S.med_logs.find(l=>l.med_id===m.id&&l.day===day&&l.slot===slot);
      items.push({med:m,slot,log,soll});
    });
  });
  items.sort((a,b)=>a.slot.localeCompare(b.slot));
  return {items,total:items.length,done:items.filter(i=>i.log).length,open:items.filter(i=>!i.log)};
}

/* ====== Verlauf (kleine Diagramme mit gemeinsamer Zeitachse) ====== */
function dayStats(day){
  const lg=S.daily_log.find(l=>l.day===day);
  const bs=S.barks.filter(b=>dayOf(b.created_at)===day), ws=S.walks.filter(w=>w.day===day);
  return {day,lg,mood:lg?.mood||null,appetite:lg?.appetite??null,stool:lg?.stool??null,barks:bs.length,bs,
    walk:ws.reduce((a,w)=>a+(+w.minutes||0),0),ws,symptoms:lg?.symptoms||[],w:weatherOf(day)};
}
function doseMarkers(from,to){
  const out=[];
  S.meds.filter(m=>m.kind==='taper'&&m.taper?.start&&m.taper.steps).forEach(m=>{
    let acc=0; const st=m.taper.start, short=m.name.length>6?m.name.slice(0,5)+'.':m.name;
    m.taper.steps.forEach(s=>{const d=addDays(st,acc); if(d>=from&&d<=to) out.push({day:d,label:`${short} ${fmtMg(s.mg)}`,med:m.name}); if(s.days!=null) acc+=s.days});
    if(!m.taper.steps.some(s=>s.days==null)){const e=addDays(st,acc); if(e>=from&&e<=to) out.push({day:e,label:`${short} 0 mg`,med:m.name})}
  });
  return out;
}
function medAdherence(from,to){
  let exp=0,given=0,skipped=0;
  const first=S.med_logs.reduce((m,l)=>!m||l.day<m?l.day:m,null); if(!first) return {exp,given,skipped};
  if(first>from) from=first; if(from>to) return {exp,given,skipped};
  const days=daysBetween(from,to)+1;
  for(let i=0;i<days;i++){const d=addDays(from,i);
    S.meds.filter(m=>m.active!==false&&m.kind!=='bedarf').forEach(m=>{
      if(m.created_at&&d<dayOf(m.created_at)) return;
      if(sollOf(m,d)==null) return;
      exp+=Math.max(1,slotsOf(m).length);
      S.med_logs.filter(l=>l.med_id===m.id&&l.day===d).forEach(l=>l.skipped?skipped++:given++);
    })}
  return {exp,given,skipped};
}
function periodStats(from,to){
  const n=daysBetween(from,to)+1, D=[...Array(n)].map((_,i)=>dayStats(addDays(from,i)));
  const logged=D.filter(x=>x.lg), moods=D.filter(x=>x.mood).map(x=>x.mood);
  const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
  const cnt=(arr,f)=>arr.filter(f).length;
  return {n,D,logged:logged.length,moodAvg:avg(moods),moodN:moods.length,

function vetReport(n){

    if(m.kind==='taper'){const ti=taperInfo(m,to);
      if(ti?.done) L.push(`- ${m.name}: ausgeschlichen seit ${dd(ti.endDay)}`);
      else if(ti?.step){let t=`- ${m.name}: aktuell ${fmtMg(ti.step.mg)}/Tag`;
        if(!ti.before&&!ti.permanent) t+=` (Stufe ${ti.i+1} von ${ti.total}, Tag ${ti.dayInStep} von ${ti.step.days})`;

    } else L.push(`- ${m.name}: ${m.dose||'–'}${slotsOf(m).length>1?' ('+slotsOf(m).map(slotLabel).join(', ')+')':' täglich'}`);
  });
  const ad=medAdherence(from,to);
  if(ad.exp) L.push(`- Gaben: ${ad.given} von ${ad.exp} eingetragen${ad.skipped?`, ${ad.skipped}× ausgelassen`:''}`);
  S.meds.filter(m=>m.kind==='bedarf').forEach(m=>{const ls=S.med_logs.filter(l=>l.med_id===m.id&&l.day>=from&&l.day<=to&&!l.skipped);
    L.push(`- ${m.name} (bei Bedarf): ${ls.length?ls.length+'× gegeben ('+ls.map(l=>fmtD(l.day)+' '+l.amount).join(', ')+')':'nicht gegeben'}`)});
  L.push('',`VERHALTEN & BEFINDEN (an ${P.logged} von ${n} Tagen protokolliert)`);

    L.push(`- Stimmung: Ø ${de1(P.moodAvg)} von 5 (gut/super an ${good} Tagen, schlecht/naja an ${bad} Tagen)${Q.moodAvg?`; Zeitraum davor Ø ${de1(Q.moodAvg)}`:''}`)}
  if(P.apN) L.push(`- Appetit: alles gefressen an ${P.apAll} Tagen, halb an ${P.apHalf}, kaum/nichts an ${P.apLow}`);
  if(P.stN) L.push(`- Kot: normal an ${P.stNorm} Tagen, weich an ${P.stSoft}, breiig/flüssig an ${P.stBad}${P.stHard?`, hart an ${P.stHard}`:''}`);
  const bt=P.D.reduce((s,x)=>s+x.barks,0);
  if(bt||Q.barksPerDay){const rs={};P.D.forEach(x=>x.bs.forEach(b=>{const l=reasonOf(b.reason).label;rs[l]=(rs[l]||0)+1}));
    const top=Object.entries(rs).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>`${k} (${v}×)`).join(', ');
    L.push(`- Bellen: Ø ${de1(P.barksPerDay)}× pro Tag${Q.barksPerDay?` (Zeitraum davor Ø ${de1(Q.barksPerDay)}×)`:''}${top?`; häufigste Auslöser: ${top}`:''}`)}
  if(P.walkPerDay) L.push(`- Spaziergänge: Ø ${Math.round(P.walkPerDay)} Min. pro Tag${P.calm?`, Entspannung unterwegs Ø ${de1(P.calm)} von 5`:''}`);
  const sy={}; P.D.forEach(x=>x.symptoms.forEach(s=>sy[s]=(sy[s]||0)+1));
  L.push(`- Auffälligkeiten: ${Object.keys(sy).length?Object.entries(sy).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} (${v} Tag${v>1?'e':''})`).join(', '):'keine eingetragen'}`);
  const ev=P.D.map(x=>({d:x.day,f:weatherFlags(x.w,x.day).filter(f=>f.lvl==='red')})).filter(x=>x.f.length);
  const notes=P.D.filter(x=>x.lg?.text).slice(-6);
  if(ev.length||notes.length){L.push('','BESONDERE TAGE');
    [...ev.map(x=>({d:x.d,t:x.f.map(f=>f.t).join(', ')})),...notes.map(x=>({d:x.day,t:x.lg.text.replace(/\s+/g,' ').slice(0,160)}))]
      .sort((a,b)=>a.d.localeCompare(b.d)).forEach(x=>L.push(`- ${fmtD(x.d)} ${x.t}`))}
  L.push('','Viele Grüße',me.name||'');
  return L.join('\n');
}

/* ====== Wetter Köln-Lövenich (Open-Meteo, ohne Schlüssel) – Fokus: Gewitter, Sturm, Starkregen ====== */
const LOC={lat:50.947,lon:6.832,name:'Lövenich'};
const EVENTS={'12-31':'Silvester','01-01':'Neujahr','11-11':'Karnevalsauftakt'};
S.weather={}; let weatherAt=0;
async function loadWeather(){
  if(Date.now()-weatherAt<36e5) return; weatherAt=Date.now();
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LOC.lat}&longitude=${LOC.lon}&hourly=weather_code,precipitation,wind_gusts_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_gusts_10m_max&timezone=Europe%2FBerlin&past_days=92&forecast_days=3`);

    d.time.forEach((t,i)=>S.weather[t]={code:d.weather_code[i],tmax:d.temperature_2m_max[i],tmin:d.temperature_2m_min[i],rain:d.precipitation_sum[i],gust:d.wind_gusts_10m_max[i],thunder:[],rainMax:0,rainH:null,gustH:null});
    h.time.forEach((t,i)=>{const day=t.slice(0,10), hr=+t.slice(11,13), w=S.weather[day]; if(!w) return;
      if(h.weather_code[i]>=95) w.thunder.push(hr);
      const p=h.precipitation[i]||0; if(p>w.rainMax){w.rainMax=p;w.rainH=hr}
      const g=h.wind_gusts_10m[i]||0; if(g>=(w.gustMaxH||0)){w.gustMaxH=g;w.gustH=hr}});
    render(true);
  }catch(e){weatherAt=0;console.warn('Wetter',e)}
}
function wmo(c){
  if(c==null) return {i:'·',l:'',t:'cloud'};
  if(c===0) return {i:'☀️',l:'Sonnig',t:'sun'};
  if(c<=2) return {i:c===1?'🌤️':'⛅',l:c===1?'Überwiegend sonnig':'Teils bewölkt',t:'sun'};
  if(c===3) return {i:'☁️',l:'Bewölkt',t:'cloud'};
  if(c<=48) return {i:'🌫️',l:'Nebel',t:'fog'};
  if(c<=57) return {i:'🌦️',l:'Nieselregen',t:'rain'};
  if(c<=67) return {i:'🌧️',l:'Regen',t:'rain'};
  if(c<=77) return {i:'🌨️',l:'Schnee',t:'snow'};
  if(c<=82) return {i:'🌧️',l:'Regenschauer',t:'rain'};
  if(c<=86) return {i:'🌨️',l:'Schneeschauer',t:'snow'};
  return {i:'⛈️',l:'Gewitter',t:'storm'};
}
function weatherOf(day){return S.weather[day]||S.daily_log.find(l=>l.day===day)?.weather||null}
const hrs=a=>{if(!a||!a.length)return'';const f=Math.min(...a),l=Math.max(...a);return f===l?`gegen ${f} Uhr`:`${f}–${l+1} Uhr`};
/* Unwetter-Ereignisse eines Tages: {k,i,t,lvl} – lvl 'red' = relevant für ein ängstliches Tier */
function weatherFlags(w,day){
  const f=[]; if(EVENTS[day.slice(5)]) f.push({k:'event',i:'🎆',t:EVENTS[day.slice(5)]+' (Feuerwerk/Lärm)',lvl:'red'});
  if(!w) return f;
  const th=w.thunder&&w.thunder.length?w.thunder:(w.code>=95?[]:null);
  if(th) f.push({k:'thunder',i:'⛈️',t:'Gewitter'+(th.length?' '+hrs(th):''),lvl:'red'});
  const g=Math.round(w.gust||0), gh=w.gustH!=null?` (gegen ${w.gustH} Uhr)`:'';
  if(g>=75) f.push({k:'wind',i:'🌪️',t:`Schwere Sturmböen bis ${g} km/h${gh}`,lvl:'red'});
  else if(g>=62) f.push({k:'wind',i:'💨',t:`Sturmböen bis ${g} km/h${gh}`,lvl:'red'});
  else if(g>=50) f.push({k:'wind',i:'🌬️',t:`Starker Wind, Böen bis ${g} km/h${gh}`,lvl:'warn'});
  const rm=w.rainMax||0;
  if(rm>=10) f.push({k:'rain',i:'🌧️',t:`Starkregen: ${n1(rm)} mm/h gegen ${w.rainH} Uhr`,lvl:'red'});
  else if(rm>=5||(w.rain||0)>=20) f.push({k:'rain',i:'🌧️',t:`Kräftiger Regen: ${n1(w.rain)} mm am Tag`,lvl:'warn'});
  return f;
}

/* ====== Tablettenvorrat ====== */
const QF={0:'',0.25:'¼',0.5:'½',0.75:'¾'};
function fmtQty(x){const q=Math.round(Math.max(0,x)*4)/4,w=Math.floor(q),f=QF[+(q-w).toFixed(2)];return (w||!f?String(w):'')+f}
const num=v=>parseFloat(String(v).replace(',','.'));
function taperUnits(m){const t=m?.taper,k=new Set();if(!t)return[];[t.pre,...(t.steps||[])].forEach(s=>s?.use&&Object.keys(s.use).forEach(x=>k.add(x)));return [...k]}
function useOn(s,m,day){ // geplanter Verbrauch an einem Tag
  if(!m||m.active===false||m.kind==='bedarf') return 0;
  if(m.kind==='taper'){const ti=taperInfo(m,day);if(!ti||!ti.step)return 0;
    if(s.use_key) return +(ti.step.use?.[s.use_key]||0);
    return s.mg_per_unit?ti.step.mg/s.mg_per_unit:0}
  return +(s.per_day||0);
}
function stockStatus(s){
  const m=S.meds.find(x=>x.id===s.med_id), slots=Math.max(1,slotsOf(m||{}).length), since=new Date(s.counted_at);
  const logs=S.med_logs.filter(l=>l.med_id===s.med_id&&!l.skipped&&new Date(l.created_at)>since);
  const used=logs.reduce((a,l)=>a+(m?.kind==='bedarf'?+(s.per_day||1):useOn(s,m,l.day)/slots),0);
  const left=Math.max(0,+s.count-used);
  const doneToday=S.med_logs.filter(l=>l.med_id===s.med_id&&l.day===today()).length;
  let rest=left,d=today(),empty=null;
  for(let i=0;i<400;i++){
    let u=useOn(s,m,d); if(i===0) u=u*Math.max(0,slots-doneToday)/slots;
    if(u>0&&rest+1e-9<u){empty=d;break}
    rest-=u; d=addDays(d,1);
  }
  const daysLeft=empty?daysBetween(today(),empty):null;
  const lvl=m?.kind==='bedarf'?(left<1?'red':left<3?'warn':'ok'):daysLeft==null?'ok':daysLeft<=7?'red':daysLeft<=14?'warn':'ok';
  return {m,left,empty,daysLeft,lvl,rest,today:useOn(s,m,today())};
}
function stockText(s,st){
  if(st.m?.kind==='bedarf') return st.left<1?'Leer – nachkaufen!':`Für ca. ${Math.floor(st.left/(+s.per_day||1))} Gaben`;
  if(!st.empty){const ti=st.m?.kind==='taper'?taperInfo(st.m,today()):null;
    if(ti?.done) return 'Wird nicht mehr gebraucht';
    if(st.m?.kind==='taper'&&ti&&ti.totalDays&&ti.step) return `Reicht bis zum Planende ✅ · danach übrig: ${fmtQty(st.rest)}`;
    return 'Reicht über ein Jahr';}
  if(st.daysLeft<=0) return 'Reicht heute nicht mehr – nachkaufen!';
  return `Reicht bis ${dayLabel(addDays(st.empty,-1))} (${fmtD(addDays(st.empty,-1))}) · noch ${st.daysLeft} Tag${st.daysLeft>1?'e':''}`;
}
function lowStock(){return S.stock.map(s=>({s,st:stockStatus(s)})).filter(x=>x.st.lvl==='red')}
function todayCard(){
  const rows=[...weatherWarnings(),...alerts().map(a=>({c:'red',i:'⚠️',t:a,s:'2 Tage in Folge – ggf. Tierärztin informieren',go:'data-go="log"'})),
    ...lowStock().map(({s,st})=>({c:'warn',i:'📦',t:`${st.m?.name||'?'} · ${s.label}`,s:stockText(s,st),go:'data-a="stock"'})),
    ...S.appointments.filter(a=>{const n=daysBetween(today(),a.day);return n>=0&&n<=1}).sort((a,b)=>(a.day+(a.time||'99')).localeCompare(b.day+(b.time||'99'))).map(a=>({c:'info',i:'📅',t:a.title,s:apptWhen(a)+(a.place?' · '+a.place:''),go:'data-a="openAppt" data-id="'+a.id+'"'}))];
  if(!rows.length) return '';
  return `<div class="card today"><div class="th">Heute wichtig</div>${rows.map(r=>`<button class="tr ${r.c}" ${r.go}><span class="ti">${r.i}</span><span class="grow"><b>${esc(r.t)}</b><span class="s">${esc(r.s)}</span></span><span class="muted">›</span></button>`).join('')}</div>`;
}
function stockBanner(){
  const l=lowStock(); if(!l.length) return '';
  return `<button class="alert stockalert" data-a="stock"><div class="alert-h">📦 Vorrat wird knapp</div><div class="alert-b">${l.map(({s,st})=>`${esc(st.m?.name||'?')} ${esc(s.label)}: ${st.m?.kind==='bedarf'?fmtQty(st.left)+' übrig':st.daysLeft<=0?'heute leer':'noch '+st.daysLeft+' T.'}`).join(' · ')}</div></button>`;
}

function apptRow(a,past){

function icsFor(a){
  const dt=a.day.replace(/-/g,''), z=n=>String(n).padStart(2,'0');
  let start,end;
  if(a.time){const [h,m]=a.time.split(':').map(Number);start=`DTSTART;TZID=Europe/Berlin:${dt}T${z(h)}${z(m)}00`;const e=new Date(2000,0,1,h+1,m);end=`DTEND;TZID=Europe/Berlin:${dt}T${z(e.getHours())}${z(e.getMinutes())}00`}
  else{start=`DTSTART;VALUE=DATE:${dt}`;end=`DTEND;VALUE=DATE:${addDays(a.day,1).replace(/-/g,'')}`}
  const x=t=>String(t||'').replace(/[,;\\]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ellie//DE','BEGIN:VEVENT',`UID:${a.id}@ellie`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,start,end,
    `SUMMARY:🐾 ${x(a.title)}`,a.place?`LOCATION:${x(a.place)}`:'',a.note?`DESCRIPTION:${x(a.note)}`:'','BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY','DESCRIPTION:Erinnerung','END:VALARM','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
}

/* ====== Erinnerungen (Web Push) ====== */
function remindField(m){
  return `<label class="f">Erinnern um (falls bis dahin nicht gegeben)</label>
    <div class="row"><input type="time" id="rem" value="${esc(m.remind_at||'')}" style="max-width:150px"><button class="btn plain" type="button" onclick="this.previousElementSibling.value=''">Keine</button></div>`;
}
function remindPatch(sh,m,kind){
  const v=kind==='bedarf'?'':(sh.querySelector('#rem')?.value||'');
  return v===(m.remind_at||'')?{}:{remind_at:v||null}; // nur mitschicken, wenn geändert
}
const isStandalone=()=>window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
let swReg=null, pushSub=null;
function pushState(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))
    return {can:false,label:'nicht möglich',hint:isStandalone()?'Dein iOS ist zu alt (ab iOS 16.4).':'Funktioniert nur, wenn du die App über das Pfoten-Icon auf dem Home-Bildschirm öffnest.'};
  if(Notification.permission==='denied') return {can:false,label:'blockiert',hint:'In den iPhone-Einstellungen → Mitteilungen → Ellie erlauben.'};
  if(Notification.permission==='granted'&&pushSub) return {can:true,on:true,label:'aktiv'};
  return {can:true,label:'aus'};
}
function b64uBytes(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function saveSub(sub){
  if(DEMO) return true;
  const j=sub.toJSON();
  const {error}=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,sub:j,author:me.name,updated_at:new Date().toISOString()},{onConflict:'endpoint'});
  if(error){console.error(error);toast('Konnte Gerät nicht speichern – SQL-Update schon ausgeführt?');return false}
  return true;
}
async function enablePush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Mitteilungen nicht erlaubt');return false}
    swReg=swReg||await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    pushSub=await swReg.pushManager.getSubscription()||await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(VAPID_PUBLIC)});
    return await saveSub(pushSub);
  }catch(e){console.error(e);toast('Aktivieren fehlgeschlagen: '+(e.message||e));return false}
}
async function initPush(){
  if(!('serviceWorker' in navigator)||location.protocol==='file:') return;
  try{
    swReg=await navigator.serviceWorker.register('sw.js');
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.tab){go(e.data.tab)}});
    if('PushManager' in window&&Notification.permission==='granted'){
      pushSub=await swReg.pushManager.getSubscription();
      if(pushSub) saveSub(pushSub); // hält das Gerät aktuell
    }
  }catch(e){console.warn('SW',e)}
}
async function sendTestPush(){
  if(DEMO){toast('Im Demo-Modus nicht möglich');return}
  const {error}=await sb.from('push_tests').insert({endpoint:pushSub?.endpoint,author:me.name});
  if(error){console.error(error);toast('Test fehlgeschlagen – SQL-Update schon ausgeführt?')}
}

/* ====== Fotos (privater Supabase-Speicher "fotos") ====== */
const BUCKET='fotos';
const urlCache={};
async function loadPhotos(){
  if(DEMO) return;
  const {data,error}=await sb.storage.from(BUCKET).list('',{limit:1000,sortBy:{column:'created_at',order:'desc'}});
  if(error||!data){S.photos=[];return}
  const files=data.filter(f=>f.id&&!f.name.startsWith('.'));
  const fresh=c=>c&&Date.now()-c.t<5*864e5; // Links gelten 7 Tage, nach 5 erneuern
  const need=files.filter(f=>!fresh(urlCache[f.name])).map(f=>f.name);
  if(need.length){
    const {data:urls}=await sb.storage.from(BUCKET).createSignedUrls(need,60*60*24*7);
    (urls||[]).forEach((u,i)=>{if(u.signedUrl) urlCache[need[i]]={url:u.signedUrl,t:Date.now()}});
  }
  S.photos=files.filter(f=>urlCache[f.name]).map(f=>({name:f.name,url:urlCache[f.name].url}));
}
function shrink(file,max=1600){
  return new Promise((ok,no)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(b=>b?ok(b):no(new Error('toBlob')),'image/jpeg',0.85)};
    img.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Bild nicht lesbar'))};
    img.src=u;
  });
}
async function uploadPhoto(file){
  const blob=await shrink(file), name=`${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
  if(DEMO){S.photos.unshift({name,url:URL.createObjectURL(blob)});return}
  const {error}=await sb.storage.from(BUCKET).upload(name,blob,{contentType:'image/jpeg'});
  if(error) throw error;
  const {data}=await sb.storage.from(BUCKET).createSignedUrl(name,60*60*24*7);
  urlCache[name]={url:data.signedUrl,t:Date.now()}; S.photos.unshift({name,url:data.signedUrl});
}
async function deletePhoto(name){
  S.photos=S.photos.filter(p=>p.name!==name);
  if(DEMO) return;
  const {error}=await sb.storage.from(BUCKET).remove([name]);
  if(error){toast('Löschen fehlgeschlagen');await loadPhotos()}
}

/* ====== Excel-Export (formatiert) ====== */
const XC={accent:'CF6A2E',zebra:'FFF8F1',line:'E8DDCD',ok:'DFF1E4',okT:'2F7D47',warn:'FBEFD2',warnT:'8A5E08',bad:'F9DCD7',badT:'B23B2B',muted:'73685D',ink:'2B2520'};
const XB={top:{style:'thin',color:{rgb:XC.line}},bottom:{style:'thin',color:{rgb:XC.line}},left:{style:'thin',color:{rgb:XC.line}},right:{style:'thin',color:{rgb:XC.line}}};
function xSheet(rows,cols,opt={}){
  // rows: Array von Objekten; cols: [[Spaltenname, Breite, {wrap,rule}]]
  const names=cols.map(c=>c[0]);
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[Object.fromEntries(names.map(n=>[n,'']))],{header:names,cellDates:true,dateNF:'dd.mm.yyyy'});
  ws['!cols']=cols.map(c=>({wch:c[1]}));
  ws['!rows']=[{hpt:30}];
  const R=Math.max(1,rows.length);
  cols.forEach((c,ci)=>{
    const h=ws[XLSX.utils.encode_cell({r:0,c:ci})];
    if(h) h.s={font:{bold:true,color:{rgb:'FFFFFF'},sz:11},fill:{fgColor:{rgb:XC.accent}},alignment:{vertical:'center',horizontal:'center',wrapText:true},border:XB};
    for(let r=1;r<=R;r++){
      const ref=XLSX.utils.encode_cell({r,c:ci}); let cell=ws[ref]; if(!cell){cell=ws[ref]={t:'s',v:''}}
      const st={font:{sz:11,color:{rgb:XC.ink}},alignment:{vertical:'top',wrapText:!!c[2]?.wrap},border:XB};
      if(r%2===0) st.fill={fgColor:{rgb:XC.zebra}};
      if(cell.t==='d'||cell.v instanceof Date){cell.z='dd.mm.yyyy';st.alignment.horizontal='left'}
      const lvl=c[2]?.rule?c[2].rule(cell.v):null;
      if(lvl){st.fill={fgColor:{rgb:XC[lvl]}};st.font={...st.font,bold:true,color:{rgb:XC[lvl+'T']}}}
      if(c[2]?.muted) st.font={...st.font,color:{rgb:XC.muted}};
      cell.s=st;
    }
  });
  if(rows.length) ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:cols.length-1}})};
  return ws;
}
const ruleMood=v=>{const n=parseInt(v,10);return !n?null:n<=2?'bad':n===3?'warn':'ok'};
const ruleAp=v=>!v?null:v==='Alles'?'ok':v==='Halb'?'warn':'bad';
const ruleSt=v=>!v?null:v==='Normal'?'ok':v==='Weich'?'warn':'bad';
const ruleNonEmpty=v=>v?'bad':null;
const ruleStatus=v=>!v?null:v==='wie geplant'?'ok':v==='abweichend'?'warn':'bad';
const ruleCalm=v=>{const n=parseInt(v,10);return !n?null:n<=2?'bad':n===3?'warn':'ok'};
function buildExport(dlogs,meds,mlogs,barks,walks,appts){
  const D=day=>new Date(day+'T12:00:00'), medById=Object.fromEntries(meds.map(m=>[m.id,m]));
  const usedKeys=new Set(barks.map(b=>b.reason));
  const RS=allReasons().filter(r=>r.active!==false||usedKeys.has(r.key));
  const days=[...new Set([...dlogs.map(l=>l.day),...mlogs.map(l=>l.day),...barks.map(b=>dayOf(b.created_at)),...walks.map(w=>w.day)])].sort();
  const protokoll=days.map(day=>{
    const lg=dlogs.find(l=>l.day===day), mood=lg&&MOODS.find(m=>m.v===lg.mood), w=lg?.weather||S.weather[day];
    const ap=APPETITE.find(a=>a.v===lg?.appetite), st=STOOL.find(x=>x.v===lg?.stool), bs=barks.filter(b=>dayOf(b.created_at)===day), ws=walks.filter(x=>x.day===day);
    const row={'Datum':D(day),'Tag':wd(day),'Stimmung':mood?`${mood.v} – ${mood.l}`:'','Appetit':ap?ap.l:'','Kot':st?st.l:'',
      'Auffälligkeiten':(lg?.symptoms||[]).join(', '),'Merkmale':(lg?.tags||[]).join(', '),'Beschreibung':lg?.text||'',
      'Gassi (Min.)':ws.length?ws.reduce((a,x)=>a+(+x.minutes||0),0):'','Gebellt':bs.length};
    RS.forEach(r=>row['davon: '+r.label]=bs.filter(b=>b.reason===r.key).length||'');
    row['Medikamente gegeben']=mlogs.filter(l=>l.day===day).map(l=>`${medById[l.med_id]?.name||'?'}: ${l.skipped?'nicht gegeben':l.amount}`).join('; ');
    row['Unwetter Lövenich']=weatherFlags(w,day).map(f=>f.t).join('; ');
    row['Eingetragen von']=lg?.author||'';
    return row;
  }).reverse();
  const pcols=[['Datum',11],['Tag',5],['Stimmung',13,{rule:ruleMood}],['Appetit',9,{rule:ruleAp}],['Kot',9,{rule:ruleSt}],['Auffälligkeiten',24,{wrap:1,rule:ruleNonEmpty}],
    ['Merkmale',22,{wrap:1}],['Beschreibung',40,{wrap:1}],['Gassi (Min.)',8],['Gebellt',8],...RS.map(r=>['davon: '+r.label,12]),['Medikamente gegeben',40,{wrap:1}],['Unwetter Lövenich',30,{wrap:1,rule:ruleNonEmpty}],['Eingetragen von',11,{muted:1}]];
  const medis=[...mlogs].sort((a,b)=>(b.day+b.slot).localeCompare(a.day+a.slot)).map(l=>{const m=medById[l.med_id];const soll=m?sollOf(m,l.day):'';
    return {'Datum':D(l.day),'Medikament':m?.name||'(gelöscht)','Zeitpunkt':slotLabel(l.slot),'Soll':soll||'','Ist':l.skipped?'nicht gegeben':l.amount,
      'Status':l.skipped?'ausgelassen':l.amount===soll||m?.kind==='bedarf'?'wie geplant':'abweichend','Notiz':l.note||'','Von':l.author||'','Uhrzeit':hm(l.created_at)}});
  const bell=[...barks].sort((a,b)=>b.created_at.localeCompare(a.created_at)).map(b=>({'Datum':D(dayOf(b.created_at)),'Uhrzeit':hm(b.created_at),'Grund':reasonOf(b.reason).label,'Von':b.author||''}));
  const gassi=[...walks].sort((a,b)=>(b.day+(b.time||'')).localeCompare(a.day+(a.time||''))).map(x=>{const c=CALM.find(k=>k.v===x.calm);
    return {'Datum':D(x.day),'Start':x.time||'','Dauer (Min.)':x.minutes||'','Entspannung':c?`${c.v} – ${c.l}`:'','Ort':x.place||'','Besonderes':x.note||'','Von':x.author||''}});
  const termine=[...appts].sort((a,b)=>(b.day+(b.time||'')).localeCompare(a.day+(a.time||''))).map(a=>({'Datum':D(a.day),'Uhrzeit':a.time||'','Termin':a.title,'Ort':a.place||'','Notiz':a.note||''}));
  // Übersicht
  const from=days[0]||today(), P=periodStats(from,today()), P14=periodStats(addDays(today(),-13),today()), adA=medAdherence(from,today()), ad14=medAdherence(addDays(today(),-13),today());
  const f1=x=>x==null?'–':Math.round(x*10)/10;
  const ov=[[`🐾 ${DOG} – Protokoll-Export`],[],['Zeitraum',`${fmtD(from)}${from.slice(0,4)} – ${fmtD(today())}${today().slice(0,4)}`],['Exportiert am',new Date().toLocaleString('de-DE')],['Protokollierte Tage',P.logged],[],
    ['Kennzahl','Gesamt','Letzte 14 Tage'],
    ['Stimmung Ø (1–5)',f1(P.moodAvg),f1(P14.moodAvg)],
    ['Alles gefressen',P.apN?pct(P.apAll,P.apN)+' %':'–',P14.apN?pct(P14.apAll,P14.apN)+' %':'–'],
    ['Kot normal',P.stN?pct(P.stNorm,P.stN)+' %':'–',P14.stN?pct(P14.stNorm,P14.stN)+' %':'–'],
    ['Bellen pro Tag',f1(P.barksPerDay),f1(P14.barksPerDay)],
    ['Gassi pro Tag (Min.)',Math.round(P.walkPerDay),Math.round(P14.walkPerDay)],
    ['Medi-Gaben eingetragen',adA.exp?`${adA.given} / ${adA.exp}`:'–',ad14.exp?`${ad14.given} / ${ad14.exp}`:'–'],
    ['Tage mit Unwetter',P.D.filter(x=>weatherFlags(x.w,x.day).some(f=>f.lvl==='red')).length,P14.D.filter(x=>weatherFlags(x.w,x.day).some(f=>f.lvl==='red')).length],
    [],['Aktuelle Medikation','Dosis heute'],
    ...meds.filter(m=>m.active!==false).map(m=>[m.name,m.kind==='bedarf'?'bei Bedarf'+(m.dose?' · '+m.dose:''):(sollOf(m,today())||m.dose||'–')])];
  const ows=XLSX.utils.aoa_to_sheet(ov); ows['!cols']=[{wch:26},{wch:24},{wch:16}]; ows['!merges']=[{s:{r:0,c:0},e:{r:0,c:2}}];
  ows['!rows']=[{hpt:34}];
  const sec=new Set([6,ov.findIndex(r=>r[0]==='Aktuelle Medikation')]);
  ov.forEach((r,ri)=>r.forEach((v,ci)=>{const c=ows[XLSX.utils.encode_cell({r:ri,c:ci})]; if(!c) return;
    if(ri===0) c.s={font:{bold:true,sz:18,color:{rgb:XC.accent}}};
    else if(sec.has(ri)) c.s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:XC.accent}},border:XB,alignment:{horizontal:ci?'center':'left'}};
    else if(ri>6) c.s={border:XB,font:{bold:ci===0},alignment:{horizontal:ci?'center':'left'},fill:ri%2?{fgColor:{rgb:XC.zebra}}:undefined};
    else c.s={font:{bold:ci===0,color:{rgb:ci===0?XC.muted:XC.ink}}};
  }));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ows,'Übersicht');
  XLSX.utils.book_append_sheet(wb,xSheet(protokoll,pcols),'Protokoll');
  XLSX.utils.book_append_sheet(wb,xSheet(medis,[['Datum',11],['Medikament',16],['Zeitpunkt',11],['Soll',14],['Ist',14],['Status',13,{rule:ruleStatus}],['Notiz',30,{wrap:1}],['Von',10,{muted:1}],['Uhrzeit',8]]),'Medikamente');
  XLSX.utils.book_append_sheet(wb,xSheet(gassi,[['Datum',11],['Start',7],['Dauer (Min.)',9],['Entspannung',16,{rule:ruleCalm}],['Ort',18],['Besonderes',34,{wrap:1}],['Von',10,{muted:1}]]),'Gassi');
  XLSX.utils.book_append_sheet(wb,xSheet(bell,[['Datum',11],['Uhrzeit',8],['Grund',24],['Von',10,{muted:1}]]),'Bellistima');
  XLSX.utils.book_append_sheet(wb,xSheet(termine,[['Datum',11],['Uhrzeit',8],['Termin',26],['Ort',30,{wrap:1}],['Notiz',30,{wrap:1}]]),'Termine');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array',cellDates:true,cellStyles:true});
  const file=new File([buf],`${DOG}_Protokoll_${today()}.xlsx`,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  return {file,stats:{days:days.length,logs:dlogs.length,meds:mlogs.length,barks:barks.length,walks:walks.length}};
}

/* ====== Login & Start ====== */
async function setName(n){
  me.name=n; lsSet('ellie.name',n);

}
function showLogin(err){
  $('#nav').hidden=true;
  $('#app').innerHTML=`<div class="login"><div class="paw">🐾</div><h1>${esc(DOG)}</h1>
    <form id="lf"><label class="f">E-Mail</label><input type="email" id="le" autocomplete="username" required>
    <label class="f">Passwort</label><input type="password" id="lp" autocomplete="current-password" required>
    ${err?`<div style="color:var(--danger);margin-top:10px" class="small">${esc(err)}</div>`:''}
    <button class="btn block" style="margin-top:16px">Anmelden</button></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
    if(error) showLogin('Anmeldung fehlgeschlagen – E-Mail oder Passwort falsch?'); else boot();
  };

function askName(){
  $('#nav').hidden=true;
  $('#app').innerHTML=`<div class="login"><div class="paw">👋</div><h1>Wer bist du?</h1>
    <div class="muted">Damit der andere sieht, wer was eingetragen hat.</div>
    <form id="nf"><input type="text" id="nm" placeholder="Dein Name" required style="margin-top:20px">
    <button class="btn block" style="margin-top:12px">Weiter</button></form></div>`;
  $('#nf').onsubmit=async e=>{e.preventDefault();const n=$('#nm').value.trim();if(n){await setName(n);boot()}};
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.append(s)})}

async function boot(){
  if(DEMO){
    me.name=lsGet('ellie.name')||'Dennis';
    if(!S.nicknames.length) seedDemo();
    render(); initPush(); loadWeather(); return;
  }
  if(!sb){
    try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')}
    catch(e){$('#app').innerHTML='<div class="login"><div class="paw">📡</div><h1>Keine Verbindung</h1><div class="muted">Bitte Internet prüfen und neu öffnen.</div></div>';return}
    sb=supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}});
  }
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return showLogin();
  me.name=session.user.user_metadata?.name||'';
  if(!me.name) return askName();
  $('#app').innerHTML='<div class="empty" style="margin-top:30vh">🐾 lädt …</div>';
  await loadAll(); render(); subscribe(); initPush();
}
// Beim Zurückkehren in die App alles neu laden (iOS trennt die Live-Verbindung im Hintergrund)
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible') return;
  if(await checkUpdate()) return;
  if(DEMO||!sb||!me.name) return;
  await loadAll(); render(true);
});
// Selbst-Update: gibt es auf GitHub eine neuere Version, lädt die App neu (nur wenn gerade nichts offen ist)
async function checkUpdate(){
  try{
    const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return false;
    const v=(await r.text()).trim();
    if(v&&v!==APP_VERSION&&!document.querySelector('.sheet')&&!ui.logDirty){
      // nur 1× pro Version versuchen (verhindert Neulade-Schleifen), mit frischer URL am Zwischenspeicher vorbei
      let tried=null; try{tried=sessionStorage.getItem('ellie.upd')}catch(e){}
      if(tried===v) return false;
      try{sessionStorage.setItem('ellie.upd',v)}catch(e){}
      const u=new URL(location.href); u.searchParams.set('v',v); location.replace(u.toString()); return true}
  }catch(e){}
  return false;
}
setInterval(checkUpdate,15*60*1000);
